/* Groups a flat list of per-variant/poulie records (PR rows or last-performance rows) into one entry per exercise,
   each carrying its own list of variant/poulie records so the table can show a single row + dropdown instead of
   one row per variant. Records within a group are sorted so the dropdown reads alphabetically. */
function groupRecsByExercise(list){
  const map = {};
  list.forEach(rec=>{
    const id = rec.ex.id;
    if(!map[id]) map[id] = { ex: rec.ex, recs: [] };
    map[id].recs.push(rec);
  });
  Object.values(map).forEach(g=>{
    g.recs.sort((a,b)=> variantOptionLabelText(a.variant,a.pulley).localeCompare(variantOptionLabelText(b.variant,b.pulley)));
  });
  return Object.values(map);
}
/* Collapses consecutive identical sets (e.g. 3× "8 reps @ 60kg") so long set lists stay readable. */
function compactSets(sets){
  const groups = [];
  (sets||[]).forEach(st=>{
    const w = round1(st.weight||0), r = st.reps||0;
    const last = groups[groups.length-1];
    if(last && last.w===w && last.r===r){ last.count++; } else { groups.push({w, r, count:1}); }
  });
  return groups;
}
function setsPillsHtml(sets){
  const groups = compactSets(sets);
  if(!groups.length) return '<span style="color:var(--muted-2);">—</span>';
  const totalVolume = (sets||[]).reduce((a,st)=>a+(st.weight||0)*(st.reps||0),0);
  const pills = groups.map(g=>`<span class="set-pill">${g.r}×${g.w}kg${g.count>1?` <b>×${g.count}</b>`:''}</span>`).join('');
  return `<div class="sets-pills">${pills}</div><div class="sets-meta">${sets.length} série(s) · ${Math.round(totalVolume).toLocaleString('fr-FR')} kg</div>`;
}

/* Série en cours : jours consécutifs (finissant aujourd'hui ou hier) avec au moins une séance. */
function currentStreakDays(){
  const dateSet = new Set(state.sessions.map(s=>s.date));
  let streak = 0;
  let cursor = new Date();
  if(!dateSet.has(todayISO())){ cursor.setDate(cursor.getDate()-1); }
  while(true){
    const iso = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
    if(dateSet.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
}

          <td data-label="Exercices">${s.entries.length}</td>
          <td class="mono" data-label="Volume">${Math.round(sessionVolume(s)).toLocaleString('fr-FR')} kg</td>
        </tr>`).join('')}
      </tbody></table>`}
    </div>`;
  document.getElementById('home-new-session').addEventListener('click', ()=> createSession());
  bindFilterChips(el);
  el.querySelectorAll('[data-session]').forEach(n=>{
    n.addEventListener('click', ()=> openSessionModal(n.dataset.session));
  });
  // « Reprendre » : ouvre l'éditeur ; le bouton « Résumé » garde l'ancien comportement (résumé de séance).
  const resumeMain = document.getElementById('home-resume-main');
  if(resumeMain){
    const go = ()=> openSessionEditor(resumeMain.dataset.resumeEdit);
    resumeMain.addEventListener('click', go);
    resumeMain.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  }
  const resumeSum = el.querySelector('[data-resume-summary]');
  if(resumeSum) resumeSum.addEventListener('click', e=>{ e.stopPropagation(); openSessionModal(resumeSum.dataset.resumeSummary); });
  bindPeriodPanel('home', 'dash', ()=> renderHomeView(true));
  // Après un rafraîchissement dû aux flèches / dates, le panneau reste ouvert.
  if(keepPeriodOpen){
    const pn = document.getElementById('home-period-panel'), ch = el.querySelector('[data-filter-panel="home-period-panel"]');
    if(pn) pn.classList.add('open'); if(ch) ch.setAttribute('aria-expanded','true');
  }
  const cls = document.getElementById('home-classify');
  if(cls) cls.addEventListener('click', ()=>{ exFilterUnclassified = true; switchView('exercises'); });
}

/* Rendu du widget "Exercices en plateau" : liste les groupes exercice+variante+poulie sans nouveau
   1RM estimé depuis PLATEAU_THRESHOLD séances ou plus, du plus stagnant au moins stagnant. Un clic sur

function renderPlateauWidget(){
  const wrap = document.getElementById('plateau-wrap');
  if(!wrap) return;
  const plateaus = computePlateaus();
  if(!plateaus.length){
    wrap.innerHTML = emptyState('M4 19V10M10 19V5M16 19V13M22 19H2','Aucun plateau détecté','Tous tes exercices avec assez d\'historique continuent de progresser. 💪');
    return;
  }
  wrap.innerHTML = exerciseHistoryTableHtml(rows);
  wrap.querySelectorAll('[data-plateau-exercise]').forEach(tr=>{
    tr.addEventListener('click', ()=> focusExerciseProgression(tr.dataset.plateauExercise, tr.dataset.plateauVariant, tr.dataset.plateauPulley));
  });
}

  document.getElementById('kpi-kcal').innerHTML = kcalStats.trackedCount ? Math.round(kcalStats.totalKcal).toLocaleString('fr-FR')+'<span style="font-size:13px;color:var(--muted);"> kcal</span>' : '—';

  const hrStats = computeHRStats(range);
  document.getElementById('kpi-hr-avg').innerHTML = hrStats.avgCount ? Math.round(hrStats.avgHr)+'<span style="font-size:13px;color:var(--muted);"> bpm</span>' : '—';
  document.getElementById('kpi-hr-avg-sub').textContent = hrStats.avgCount ? `FC moy. sur ${hrStats.avgCount} séance(s) renseignée(s)` : 'aucune FC moyenne renseignée';
  document.getElementById('kpi-hr-max').innerHTML = hrStats.maxCount ? Math.round(hrStats.maxHr)+'<span style="font-size:13px;color:var(--muted);"> bpm</span>' : '—';
  document.getElementById('kpi-hr-max-sub').textContent = hrStats.maxCount ? `sur ${hrStats.maxCount} séance(s) renseignée(s)` : 'aucune FC max renseignée';

  drawStatsPane(state.statsTab, range);
}
/* Dessine uniquement les graphiques de l'onglet affiché (un canvas masqué n'a pas de taille) ;
   rappelé à chaque changement d'onglet et à chaque changement de période ou de type. */
function drawStatsPane(tab, range){
  range = range || getActiveRange();
  if(tab==='summary'){ renderVolumeTrendChart(range); renderDurationTrendChart(range); renderKcalTrendChart(range); renderWeekdayChart(range); }
  else if(tab==='progress'){ renderProgressionChart(); }
  else if(tab==='muscles'){ renderMuscleChart(range); renderMuscleHeatmap(range); renderSessionTypeChart(range); }
  else if(tab==='heart'){ renderHRTrendChart(range); }
}

function emptyState(icon, title, sub){
  return `<div class="empty">${iconSvg(icon)}<div class="t">${title}</div><div>${sub}</div></div>`;
}
function renderProgressionChart(){
  bindExercisePickerButton(document.getElementById('dash-exercise-select'));
  const varSel = document.getElementById('dash-variant-select');
  const pulleySel = document.getElementById('dash-pulley-select');
  const ex = state.exercises.find(e=>e.id===state.selectedExerciseId);
  const pointBar = document.getElementById('dash-chart-point-bar');
  if(!ex){
    varSel.innerHTML = '';
    if(pointBar) pointBar.style.display='none';
    renderChartSafe('chart-progression', {type:'line', data:{labels:[],datasets:[]}});
    return;
  }
  const vm = variantMenu(ex, state.sessions, state.selectedVariant);
  varSel.innerHTML = vm.html; varSel.value = state.selectedVariant = vm.value;
  if(ex.isCable){
    const pm = pulleyMenu(ex, state.sessions, state.selectedVariant, state.selectedPulley);
    pulleySel.innerHTML = pm.html; pulleySel.value = state.selectedPulley = pm.value;
    pulleySel.style.display='';
  }else{ pulleySel.innerHTML='<option value="__all__">Sans poulie</option>'; pulleySel.value='__all__'; pulleySel.style.display='none'; state.selectedPulley='__all__'; }

  const range = getActiveRange();
  const hist = getExerciseHistory(ex.id, state.selectedVariant, state.selectedPulley, range);
  const wrap = document.getElementById('dash-chart-wrap');
  if(hist.length===0){
    if(pointBar) pointBar.style.display='none';
    const filtered = (range.from || range.to || state.dashTypeFilter!=='__all__');
    wrap.innerHTML = filtered
      ? emptyState('M4 19V10M10 19V5M16 19V13M22 19H2','Rien sur cette période',"Cet exercice n'apparaît dans aucune séance sur la période sélectionnée. Élargis la période pour voir sa progression.")
      : emptyState('M4 19V10M10 19V5M16 19V13M22 19H2','Pas encore de donnée',"Cet exercice n'apparaît dans aucune séance importée.");
    return;
  }
  if(!document.getElementById('chart-progression')){
    wrap.innerHTML = '<canvas id="chart-progression"></canvas>';
  }
  const chargeData = hist.map(h=>round1(h.maxWeight));
  const rmData = hist.map(h=>round1(h.best1rm));
  const volumeData = hist.map(h=>round1(h.volume));
  const maxCharge = Math.max(0, ...chargeData);
  const allVals = chargeData.concat(rmData).filter(v=>v>0);
  const dataMin = allVals.length ? Math.min(...allVals) : 0;
  const dataMax = allVals.length ? Math.max(...allVals) : 0;
  const pad = Math.max((dataMax-dataMin)*0.15, dataMax*0.08, 2.5);
  const yMin = Math.max(0, Math.floor(dataMin-pad));
  const yMax = Math.ceil(dataMax+pad);
  const volMax = Math.max(0, ...volumeData);
  const volYMax = Math.ceil((volMax*1.25 || 10));

  if(pointBar){
    pointBar.style.display='none';
    pointBar.innerHTML='';
  }
  function showPointInfo(idx){
    const point = hist[idx];
    if(!pointBar || !point) return;
    pointBar.style.display='flex';
    pointBar.innerHTML = `
      <span class="cpb-info">${fmtDateShort(point.date)} — <b>${round1(point.maxWeight)} kg</b> · 1RM <b>${round1(point.best1rm)} kg</b> · Volume <b>${round1(point.volume).toLocaleString('fr-FR')} kg</b></span>
      <button class="btn ghost" id="dash-chart-goto-history">Voir l'historique →</button>
    `;
    document.getElementById('dash-chart-goto-history').addEventListener('click', ()=>{
      openExerciseHistoryModal(ex.id, { variant: state.selectedVariant, pulley: state.selectedPulley, highlightDate: point.date });
    });
  }

  renderChartSafe('chart-progression', {
    type:'line',
    data:{
      labels: hist.map(h=>fmtDateShort(h.date)),
      datasets:[
        {
          type:'bar',
          label:'Volume séance (kg)',
          data: volumeData,
          backgroundColor:'rgba(143,144,150,0.28)',
          hoverBackgroundColor:'rgba(143,144,150,0.42)',
          borderRadius:3,
          borderSkipped:false,
          order:2,
          yAxisID:'y1'
        },
        {
          label:'Charge max (kg)',
          data: chargeData,
          borderColor:COLORS.push,
          backgroundColor:'rgba(228,87,46,0.10)',
          borderWidth:2.5,
          tension:0,
          fill:true,
          pointRadius: chargeData.map(v=>v>0 && v===maxCharge ? 5 : 3),
          pointHoverRadius:6,
          pointHitRadius:14,
          pointBackgroundColor:COLORS.push,
          pointBorderColor:COLORS.surface,
          pointBorderWidth:1.5,
          order:1,
          yAxisID:'y'
        },
        {
          label:'1RM estimée (kg)',
          data: rmData,
          borderColor:COLORS.steel,
          backgroundColor:'transparent',
          borderWidth:1.75,
          borderDash:[5,4],
          tension:0,
          pointRadius:2.5,
          pointHoverRadius:5,
          pointHitRadius:14,
          pointBackgroundColor:COLORS.steel,
          pointBorderColor:COLORS.surface,
          pointBorderWidth:1,
          order:1,
          yAxisID:'y'
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      onHover:(evt, elements)=>{
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
        if(elements.length) showPointInfo(elements[0].index);
      },
      plugins:{
        legend:{ labels:{color:COLORS.muted, font:{size:11}, usePointStyle:true, boxWidth:8, padding:14} },
        tooltip:{ callbacks:{ label: (ctx)=> ctx.dataset.yAxisID==='y1'
          ? `${ctx.dataset.label}: ${Number(ctx.raw).toLocaleString('fr-FR')} kg`
          : `${ctx.dataset.label}: ${ctx.formattedValue} kg` } }
      },
      scales:{
        x: Object.assign(chartGridOpts(), {ticks:Object.assign({}, chartGridOpts().ticks, {maxRotation:0, autoSkip:true, autoSkipPadding:12})}),
        y: Object.assign(chartGridOpts(), {suggestedMin:yMin, suggestedMax:yMax}),
        y1: Object.assign(chartGridOpts(), {
          position:'right',
          suggestedMin:0,
          suggestedMax:volYMax,
          grid:{drawOnChartArea:false, drawTicks:false},
          title:{display:true, text:'Volume (kg)', color:COLORS.muted, font:{size:10}}
        })
      }
    }
  });
}

/* Widget "Carte de chaleur musculaire" : colore les zones du corps (face + dos) selon le volume
   fait sur chaque groupe musculaire pendant la période analysée. Réutilise getMuscleVolumeDistribution
   (déjà calculé pour le doughnut "Répartition du volume"), donc reste toujours cohérent avec lui. */
function renderMuscleHeatmap(range){
  const frontEl = document.getElementById('heatmap-front');
  const backEl = document.getElementById('heatmap-back');
  const legendEl = document.getElementById('heatmap-legend');
  if(!frontEl || !backEl || !legendEl) return;

  const totals = getMuscleVolumeDistribution(range);
  const localizable = MUSCLE_GROUPS.filter(m=>m.id!=='autre');
  const max = Math.max(1, ...localizable.map(m=>totals[m.id]||0));

  function regionOpacity(val){
    if(!val || val<=0.01) return 0.06;
    const t = Math.sqrt(val/max); // racine carrée pour que les volumes moyens restent visibles
    return 0.16 + t*0.74;
  }
  function regionsSvg(list){
    return list.map(r=>{
      const val = totals[r.id]||0;
      const info = muscleInfo(r.id);
      const op = regionOpacity(val).toFixed(3);
      const titleTxt = `${escapeHtml(info.label)} : ${Math.round(val).toLocaleString('fr-FR')} kg`;
      const attrs = `data-muscle="${r.id}" fill="var(--accent)" fill-opacity="${op}" stroke="var(--border)" stroke-width="1"`;
      if(r.shape==='ellipse'){
        return `<ellipse cx="${r.cx}" cy="${r.cy}" rx="${r.rx}" ry="${r.ry}" ${attrs}><title>${titleTxt}</title></ellipse>`;
      }
      return `<polygon points="${r.points}" ${attrs}><title>${titleTxt}</title></polygon>`;
    }).join('');
  }

  const outlineAttrs = 'fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"';
  frontEl.innerHTML = `<g ${outlineAttrs}>${BODY_OUTLINE_SVG}</g><g class="heatmap-regions">${regionsSvg(BODY_REGIONS.front)}</g>`;
  backEl.innerHTML = `<g ${outlineAttrs}>${BODY_OUTLINE_SVG}</g><g class="heatmap-regions">${regionsSvg(BODY_REGIONS.back)}</g>`;

  const entries = localizable.map(m=>({...m, val: totals[m.id]||0})).sort((a,b)=>b.val-a.val);
  const autreVal = totals['autre']||0;
  legendEl.innerHTML = entries.map(e=>{
    const dotOp = e.val>0.01 ? regionOpacity(e.val).toFixed(2) : 0.15;
    return `<div class="heatmap-legend-row">
      <span class="dot" style="opacity:${dotOp};"></span>
      <span class="name" style="color:${e.val>0.01?'var(--text)':'var(--muted-2)'};">${escapeHtml(e.label)}</span>
      <span class="val mono">${Math.round(e.val).toLocaleString('fr-FR')} kg</span>
    </div>`;
  }).join('') + (autreVal>0.01 ? `
    <div class="heatmap-legend-row" style="margin-top:4px;padding-top:8px;border-top:1px solid var(--border);">
      <span class="name" style="color:var(--muted);">Autre (non localisé sur le corps)</span>
      <span class="val mono">${Math.round(autreVal).toLocaleString('fr-FR')} kg</span>
    </div>` : '');

  if(entries.every(e=>e.val<=0.01) && autreVal<=0.01){
    legendEl.innerHTML = `<div style="color:var(--muted-2);font-size:12.5px;">Aucune séance sur cette période.</div>` + legendEl.innerHTML;
  }
}

function renderHRTrendChart(range){
  const rowEl = document.getElementById('hr-trend-row');
  const legendEl = document.getElementById('hr-trend-legend');
  const extremesEl = document.getElementById('hr-extremes-legend');
  if(!rowEl) return;
  const series = computeHRSeries(range);

  if(series.length===0){
    if(legendEl) legendEl.innerHTML = '';
    if(extremesEl) extremesEl.innerHTML = '';
    rowEl.innerHTML = emptyState('M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78zM8 12.5h2l1.5-3 2 5 1.5-2h2','Rien à afficher','Aucune donnée de fréquence cardiaque. Renseigne la FC moyenne ou max d\'une séance validée pour la voir ici.');
    return;
  }

  if(legendEl){
    legendEl.innerHTML = `
      <span style="display:flex;align-items:center;gap:6px;"><span style="width:16px;height:0;border-top:2px solid var(--muted);display:inline-block;"></span>FC moyenne</span>
      <span style="display:flex;align-items:center;gap:6px;"><span style="width:16px;height:0;border-top:2px dashed var(--muted);display:inline-block;"></span>FC max</span>
      <span style="width:1px;height:14px;background:var(--border);"></span>
      ${Object.entries(SESSION_TYPES).map(([k,t])=>`<span style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:${t.color};display:inline-block;flex-shrink:0;"></span>${escapeHtml(k==='other'?'Autres':t.label)}</span>`).join('')}
    `;
  }

  const bounds = niceHRAxisBounds(series);
  const extremes = computeHRExtremes(series);
  const isHighlighted = (i, a, b) => i===a || i===b;

  // Petite légende sous le graphique : les 4 points mis en évidence, regroupés par mesure
  // (FC moyenne / FC max) pour qu'on identifie immédiatement de quoi il s'agit, avec une icône de

      return `<div onclick="openSessionModal('${s.id}')" onmouseover="this.style.background='var(--surface-3, rgba(255,255,255,0.04))'" onmouseout="this.style.background='transparent'" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;transition:background .12s;">
        <span style="font-size:13px;width:14px;flex-shrink:0;text-align:center;color:var(--muted);">${arrow}</span>
        <span style="font-size:11.5px;color:var(--muted);width:62px;flex-shrink:0;">${label}</span>
        <span style="width:8px;height:8px;border-radius:50%;background:${s.typeColor};flex-shrink:0;"></span>
        <span class="mono" style="font-size:13px;color:var(--text);font-weight:700;flex-shrink:0;">${Math.round(val)}<span style="font-size:10.5px;font-weight:400;color:var(--muted);"> bpm</span></span>
        <span style="font-size:11.5px;line-height:1.3;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere;">${s.label} · ${escapeHtml(typeLabelOf(s))}</span>
        <span style="font-size:11px;color:var(--accent);white-space:nowrap;flex-shrink:0;">Voir →</span>
      </div>`;
    };
    const group = (icon, title, rowsHtml)=>`
      <div style="border:1px solid var(--border);border-radius:10px;padding:10px 10px 4px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border);">
          ${icon}<span style="font-size:12.5px;font-weight:700;color:var(--text);">${title}</span>
        </div>
        ${rowsHtml}
      </div>`;
    const iconCircle = `<svg width="14" height="14" viewBox="0 0 14 14" style="flex-shrink:0;"><circle cx="7" cy="7" r="5.5" fill="${COLORS.muted}" stroke="${COLORS.surface}" stroke-width="1.5"/></svg>`;

    extremesEl.innerHTML =

  // Toutes les valeurs sont tracées, mais on n'affiche qu'une étiquette de date sur N pour rester lisible.
  const targetLabelSpacing = 68;
  const skipEvery = Math.max(1, Math.round(targetLabelSpacing / PX_PER_POINT));

  // Rayon/bordure de point plus marqués sur les 4 records (min/max de la moyenne et du max) pour les mettre en évidence.
  const avgRadius = series.map((s,i)=> isHighlighted(i, extremes.maxAvg, extremes.minAvg) ? 7 : 4);
  const avgHoverRadius = avgRadius.map(r=>r+2);
  const avgBorderWidth = series.map((s,i)=> isHighlighted(i, extremes.maxAvg, extremes.minAvg) ? 2.5 : 1.5);
  const avgBorderColor = series.map((s,i)=> isHighlighted(i, extremes.maxAvg, extremes.minAvg) ? COLORS.text : COLORS.surface);
  const maxRadius = series.map((s,i)=> isHighlighted(i, extremes.maxMax, extremes.minMax) ? 7 : 4);
  const maxHoverRadius = maxRadius.map(r=>r+2);
  const maxBorderWidth = series.map((s,i)=> isHighlighted(i, extremes.maxMax, extremes.minMax) ? 2.5 : 1.5);
  const maxBorderColor = series.map((s,i)=> isHighlighted(i, extremes.maxMax, extremes.minMax) ? COLORS.text : COLORS.surface);

  renderChartSafe('chart-hr-trend', {
    type:'line',
    data:{
      labels: series.map(s=>s.label),
      datasets:[
        {
          label:'FC moyenne', data: series.map(s=>s.hrAvg!=null?Math.round(s.hrAvg):null),
          borderColor:'rgba(143,144,150,0.55)', backgroundColor:'transparent',
          tension:0.3, spanGaps:true,
          pointRadius:avgRadius, pointHoverRadius:avgHoverRadius, pointStyle:'circle',
          pointBackgroundColor: series.map(s=>s.typeColor), pointBorderColor:avgBorderColor, pointBorderWidth:avgBorderWidth
        },
        {
          label:'FC max', data: series.map(s=>s.hrMax!=null?Math.round(s.hrMax):null),
          borderColor:'rgba(143,144,150,0.55)', backgroundColor:'transparent', borderDash:[5,3],
          tension:0.3, spanGaps:true,
          pointRadius:maxRadius, pointHoverRadius:maxHoverRadius, pointStyle:'triangle',
          pointBackgroundColor: series.map(s=>s.typeColor), pointBorderColor:maxBorderColor, pointBorderWidth:maxBorderWidth
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      // Un clic sur un point ouvre directement la séance correspondante.
      onClick:(evt, elements)=>{
        if(!elements.length) return;
        const s = series[elements[0].index];
        if(s && s.id) openSessionModal(s.id);
      },
      onHover:(evt, elements)=>{
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{
          title:(items)=> items.length && series[items[0].dataIndex] ? `${series[items[0].dataIndex].label} — ${series[items[0].dataIndex].name}` : '',
          label:(ctx)=> `${ctx.dataset.label} : ${ctx.parsed.y} bpm`,
          footer:()=> 'Cliquer pour ouvrir la séance'

      },
      scales:{
        x: Object.assign({}, chartGridOpts(), { ticks: Object.assign({}, chartGridOpts().ticks, {

        }) }),
        y:{ min:bounds.min, max:bounds.max, grid:{color:COLORS.border, drawTicks:false}, border:{display:false}, ticks:{display:false} }

  // La colonne d'axe Y est du HTML positionné en absolu, à la position pixel exacte lue sur le
  // graphique réellement rendu (chart.scales.y.getPixelForValue) : alignement garanti même au scroll,

  const chartInst = charts['chart-hr-trend'];
  const axisCol = document.getElementById('hr-axis-col');
  if(chartInst && axisCol){

/* Merges all-time PRs and last-performance into one record per exercise+variant(+poulie), used by the
   "Records & dernières séances" view so PR and last-time info live in a single row instead of two tables. */
function computeRecordsMerged(){
  const prMap = {}; computeAllPRs().forEach(rec=>{ prMap[prGroupKey(rec.ex.id, rec.variant, rec.pulley)] = rec; });
  const map = {};
  computeLastPerformance().forEach(rec=>{
    const key = prGroupKey(rec.ex.id, rec.variant, rec.pulley);
    map[key] = { ex: rec.ex, variant: rec.variant, pulley: rec.pulley, last: rec, pr: prMap[key] || null };
  });
  computeAllPRs().forEach(rec=>{
    const key = prGroupKey(rec.ex.id, rec.variant, rec.pulley);
    if(!map[key]) map[key] = { ex: rec.ex, variant: rec.variant, pulley: rec.pulley, last: null, pr: rec };
  });
  return Object.values(map);
}
/* Cell contents for one merged PR + last-performance row, reused both for the initial render and for the
   variant/poulie dropdown's onchange handler. */
function recordsRowCellsHtml(rec){
  const last = rec.last, pr = rec.pr;
  const lastMaxW = last ? Math.max(0, ...last.entry.sets.map(st=>st.weight||0)) : 0;
  let deltaHtml;
  if(last && pr && pr.maxWeight>0 && lastMaxW>=pr.maxWeight){ deltaHtml = `<span class="badge ok">Record</span>`; }
  else if(last && pr && pr.maxWeight>0){ deltaHtml = `<span class="mono" style="color:var(--muted);">−${round1(pr.maxWeight-lastMaxW)} kg</span>`; }
  else { deltaHtml = '<span style="color:var(--muted-2);">—</span>'; }
  return {
    lastDate: last ? fmtDateShort(last.date) : '—',
    sets: last ? setsPillsHtml(last.entry.sets) : '<span style="color:var(--muted-2);">—</span>',
    weight: pr ? `${round1(pr.maxWeight)} kg${pr.maxWeightReps ? ` × ${pr.maxWeightReps}` : ''}` : '—',
    rm: pr ? `${round1(pr.best1rm)} kg` : '—',
    prDate: pr && pr.best1rmDate ? fmtDateShort(pr.best1rmDate) : '—',
    delta: deltaHtml
  };
}

        <select id="rec-sort-select" class="rec-sort-mobile" aria-label="Trier par">
          ${[['name','Exercice'],['lastdate','Dernière fois'],['weight','Record (charge max)'],['1rm','1RM estimée'],['prdate','Date du record']].map(([k,l])=>`<option value="${k}" ${state.recSort.key===k?'selected':''}>Trier par : ${l}</option>`).join('')}
        </select>
        <button type="button" class="btn ghost icon-btn-square rec-sort-mobile" id="rec-sort-dir" aria-label="Inverser l'ordre de tri">${state.recSort.dir==='asc'?'↑':'↓'}</button>
      </div>
      <div id="rec-table-wrap"></div>
    </div>
  `;
  document.getElementById('rec-search').addEventListener('input', e=>{ state.recSearch = e.target.value; renderRecordsTable(); });
  document.getElementById('rec-muscle-filter').addEventListener('change', e=>{ state.recMuscleFilter = e.target.value; renderRecordsTable(); });
  document.getElementById('rec-sort-select').addEventListener('change', e=>{
    state.recSort.key = e.target.value; state.recSort.dir = e.target.value==='name' ? 'asc' : 'desc';
    document.getElementById('rec-sort-dir').textContent = state.recSort.dir==='asc' ? '↑' : '↓';
    renderRecordsTable();
  });
  document.getElementById('rec-sort-dir').addEventListener('click', e=>{
    state.recSort.dir = state.recSort.dir==='asc' ? 'desc' : 'asc';
    e.currentTarget.textContent = state.recSort.dir==='asc' ? '↑' : '↓';
    renderRecordsTable();
  });
  renderRecordsTable();
}
function renderRecordsTable(){
  const wrap = document.getElementById('rec-table-wrap');
  if(!wrap) return;
  let list = computeRecordsMerged();
  if(state.recMuscleFilter!=='__all__') list = list.filter(rec=>rec.ex.muscles.includes(state.recMuscleFilter));
  if(state.recSearch.trim()){ const q=normalizeExerciseName(state.recSearch); list = list.filter(rec=>normalizeExerciseName(rec.ex.name).includes(q)); }

  let groups = groupRecsByExercise(list);
  // Default shown variant/poulie per exercise = whichever was trained most recently (falls back to PR date).
  groups.forEach(g=>{
    let bestIdx = 0;
    const score = r => (r.last && r.last.date) || (r.pr && r.pr.best1rmDate) || '';
    g.recs.forEach((r,i)=>{ if(score(r) > score(g.recs[bestIdx])) bestIdx = i; });
    g.defaultIdx = bestIdx;
  });

  const {key,dir} = state.recSort;
  groups = groups.slice().sort((a,b)=>{
    const ra=a.recs[a.defaultIdx], rb=b.recs[b.defaultIdx];
    let va,vb;
    if(key==='name'){ va=a.ex.name.toLowerCase(); vb=b.ex.name.toLowerCase(); }
    else if(key==='weight'){ va=ra.pr?ra.pr.maxWeight:0; vb=rb.pr?rb.pr.maxWeight:0; }
    else if(key==='1rm'){ va=ra.pr?ra.pr.best1rm:0; vb=rb.pr?rb.pr.best1rm:0; }
    else if(key==='prdate'){ va=(ra.pr?ra.pr.best1rmDate:'')||''; vb=(rb.pr?rb.pr.best1rmDate:'')||''; }
    else { va=(ra.last?ra.last.date:'')||''; vb=(rb.last?rb.last.date:'')||''; }
    if(typeof va==='string') return dir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return dir==='asc' ? va-vb : vb-va;
  });

  document.getElementById('rec-count-pill').textContent = groups.length + (groups.length>1 ? ' exercices' : ' exercice');
  if(groups.length===0){
    wrap.innerHTML = emptyState('M4 19V10M10 19V5M16 19V13M22 19H2','Rien à afficher','Aucun exercice ne correspond à ces critères, ou aucune séance importée pour le moment.');
    return;
  }
  wrap.innerHTML = `<table class="tbl-cards"><thead>
  <tr class="grp-head-row">
    <th colspan="3"></th>
    <th colspan="3" class="grp-title grp-last"><span class="grp-dot"></span>Dernière séance</th>
    <th colspan="3" class="grp-title grp-pr"><span class="grp-dot"></span>Record personnel (PR)</th>
  </tr>
  <tr>
    <th data-sort="name">Exercice${dashSortArrow(state.recSort,'name')}</th>
    <th>Variante</th>
    <th>Muscles</th>
    <th class="col-last col-last-start" data-sort="lastdate">Dernière fois${dashSortArrow(state.recSort,'lastdate')}</th>
    <th class="col-last">Séries</th>
    <th class="col-last">Écart au record</th>
    <th class="col-pr col-pr-start" data-sort="weight">Record (charge max)${dashSortArrow(state.recSort,'weight')}</th>
    <th class="col-pr" data-sort="1rm" title="Charge maximale théorique sur 1 répétition">1RM estimée${dashSortArrow(state.recSort,'1rm')}</th>
    <th class="col-pr" data-sort="prdate">Date du record${dashSortArrow(state.recSort,'prdate')}</th>
  </tr>
  </thead><tbody>
  ${groups.map(g=>{
    const rec = g.recs[g.defaultIdx];
    const hasChoice = g.recs.length>1;
    const cells = recordsRowCellsHtml(rec);
    return `<tr class="clickable" data-exid="${g.ex.id}" data-variant="${escapeHtml(rec.variant)}" data-pulley="${escapeHtml(rec.pulley)}">
      <td data-label="Exercice">${escapeHtml(g.ex.name)}</td>
      <td data-label="Variante">${hasChoice ? `<select class="table-variant-select" data-scope="rec" data-exid="${g.ex.id}">${g.recs.map((r,i)=>`<option value="${i}" ${i===g.defaultIdx?'selected':''}>${escapeHtml(variantOptionLabelText(r.variant,r.pulley))}</option>`).join('')}</select>` : variantLabelHtml(rec.variant, rec.pulley)}</td>
      <td data-label="Muscles">${muscleTagsHtml(g.ex)}</td>
      <td class="mono col-last col-last-start" data-cell="lastdate" data-label="Dernière fois"><span class="cell-inner-label">Dernière fois</span>${cells.lastDate}</td>
      <td class="col-last" data-cell="sets" data-label="Séries">${cells.sets}</td>
      <td class="col-last" data-cell="delta" data-label="Écart au record">${cells.delta}</td>
      <td class="mono col-pr col-pr-start" data-cell="weight" data-label="Record (charge max)"><span class="cell-inner-label">Record (charge max)</span>${cells.weight}</td>
      <td class="mono col-pr" data-cell="1rm" data-label="1RM estimée" title="Charge maximale théorique sur 1 répétition">${cells.rm}</td>
      <td class="mono col-pr" data-cell="prdate" data-label="Date du record">${cells.prDate}</td>
    </tr>`;
  }).join('')}
  </tbody></table>`;

  recTableGroupsMap = {}; groups.forEach(g=>{ recTableGroupsMap[g.ex.id] = g.recs; });

  wrap.querySelectorAll('th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.sort;
      if(state.recSort.key===k) state.recSort.dir = state.recSort.dir==='asc' ? 'desc' : 'asc';
      else { state.recSort.key = k; state.recSort.dir = k==='name' ? 'asc' : 'desc'; }
      renderRecordsTable();
    });
  });
  wrap.querySelectorAll('tr[data-exid]').forEach(tr=>{
    tr.addEventListener('click', (ev)=>{
      if(ev.target.closest('select')) return;
      focusExerciseProgression(tr.dataset.exid, tr.dataset.variant, tr.dataset.pulley);
    });
  });
  wrap.querySelectorAll('select.table-variant-select[data-scope="rec"]').forEach(sel=>{
    sel.addEventListener('click', ev=> ev.stopPropagation());
    sel.addEventListener('change', ()=>{
      const exId = sel.dataset.exid;
      const rec = recTableGroupsMap[exId][Number(sel.value)];
      const tr = sel.closest('tr');
      tr.dataset.variant = rec.variant||''; tr.dataset.pulley = rec.pulley||'';
      const cells = recordsRowCellsHtml(rec);
      tr.querySelector('[data-cell="lastdate"]').innerHTML = `<span class="cell-inner-label">Dernière fois</span>${escapeHtml(cells.lastDate)}`;
      tr.querySelector('[data-cell="sets"]').innerHTML = cells.sets;
      tr.querySelector('[data-cell="weight"]').innerHTML = `<span class="cell-inner-label">Record (charge max)</span>${escapeHtml(cells.weight)}`;
      tr.querySelector('[data-cell="1rm"]').textContent = cells.rm;
      tr.querySelector('[data-cell="prdate"]').textContent = cells.prDate;
      tr.querySelector('[data-cell="delta"]').innerHTML = cells.delta;
    });
  });
}

function shiftMonth(delta){
  state.calMonth += delta;
  if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
  if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
  drawCalendarGrid();
}
function drawCalendarGrid(){
  document.getElementById('cal-label').textContent = `${MONTHS_FR[state.calMonth]} ${state.calYear}`;
  const first = new Date(state.calYear, state.calMonth, 1);
  const startWeekday = (first.getDay()+6)%7; // Monday = 0
  const daysInMonth = new Date(state.calYear, state.calMonth+1, 0).getDate();
  const todayIso = todayISO();

  const sessionsByDate = {};
  state.sessions.forEach(s=>{ (sessionsByDate[s.date] = sessionsByDate[s.date]||[]).push(s); });

  let cells = '';
  DAYS_FR.forEach(d=> cells += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const daySessions = sessionsByDate[iso] || [];
    const isToday = iso===todayIso;
    const types = daySessions.map(s=>sessionTypeInfo(s.name));
    let cellVars = '';
    if(types.length===1){
      cellVars = `--sb-bg:${types[0].bg};--sb-border:${types[0].border};--sb-color:${types[0].color};`;
    }
    const pills = types.map(t=>`<span class="cal-type-pill" style="--sb-color:${t.color};--sb-bg:${t.bgStrong};">${escapeHtml(t.label)}</span>`).join('');
    cells += `<div class="cal-cell ${daySessions.length? 'has-session':''} ${isToday?'is-today':''}" ${daySessions.length?`data-day="${iso}" style="${cellVars}"`:''}>
      <div class="cal-daynum">${d}</div>
      ${daySessions.length? `<div class="cal-types">${pills}</div>` : ''}
    </div>`;
  }
  document.getElementById('cal-grid-wrap').innerHTML = `<div class="cal-grid">${cells}</div>`;
  document.querySelectorAll('.cal-cell[data-day]').forEach(c=>{
    c.addEventListener('click', ()=> openDayModal(c.dataset.day, sessionsByDate[c.dataset.day]));
  });

  if(!document.getElementById('cal-style')){
    const st = document.createElement('style');
    st.id='cal-style';
    st.textContent = `
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
      .cal-dow{font-size:11px;color:var(--muted-2);text-transform:uppercase;text-align:center;padding-bottom:6px;font-weight:600;}
      .cal-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;min-height:74px;padding:8px;transition:border-color .12s, transform .12s, box-shadow .12s;}
      .cal-cell.empty-cell{background:transparent;border-color:transparent;}
      .cal-cell.has-session{cursor:pointer;background:var(--sb-bg, var(--surface-2));border-color:var(--sb-border, var(--border));}
      .cal-cell.has-session:hover{border-color:var(--sb-color, var(--accent));transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.28);}
      .cal-cell.is-today{box-shadow:0 0 0 1.5px var(--accent) inset;}
      .cal-cell.is-today .cal-daynum{color:var(--accent);font-weight:800;}
      .cal-daynum{font-family:var(--font-mono);font-size:13px;color:var(--muted);}
      .cal-types{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;}
      .cal-type-pill{font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:20px;background:var(--sb-bg);color:var(--sb-color);letter-spacing:0.02em;text-transform:uppercase;line-height:1.4;}
      @media(max-width:640px){
        .cal-grid{gap:4px;}
        .cal-cell{min-height:46px;padding:5px 4px;border-radius:7px;}
        .cal-daynum{font-size:11px;}
        .cal-types{margin-top:4px;gap:2px;}
        .cal-type-pill{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;display:inline-block;}
        .cal-dow{font-size:9.5px;}
      }
    `;
    document.head.appendChild(st);
  }
}

async function deleteSession(sid){
  if(!confirm('Supprimer définitivement cette séance ? Cette action est irréversible.')) return;
  state.sessions = state.sessions.filter(s=>s.id!==sid);
  await saveSessions();
  closeModal();
  showToast('Séance supprimée');
  renderNav();
  if(state.currentView==='calendar') drawCalendarGrid();
  if(state.currentView==='dashboard') renderDashboard(); if(state.currentView==='home') renderHomeView();
}

    <div class="card">${list.length ? `<table class="tbl-cards"><thead><tr><th>Date</th><th>Séance</th><th>Exercices</th><th>Volume</th><th>Données montre</th><th></th></tr></thead><tbody>${list.map(s=>{

    }).join('')}</tbody></table>` : emptyState('CAL','Aucune séance','Crée ta première séance pour la remplir au fil de ton entraînement.')}</div>`;
  document.getElementById('new-session-btn').addEventListener('click', ()=> createSession());

/* Menu « ⋯ » réutilisable : bouton + panneau ; se ferme au clic ailleurs ou avec Échap. */
function closeMoreMenus(){
  document.querySelectorAll('.more-menu.open').forEach(m=> m.classList.remove('open'));
  document.querySelectorAll('[aria-haspopup="true"][aria-expanded="true"].icon-btn-square').forEach(b=> b.setAttribute('aria-expanded','false'));
}
function bindMoreMenu(btnId, menuId){
  const btn = document.getElementById(btnId), menu = document.getElementById(menuId);
  if(!btn || !menu) return;
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const open = !menu.classList.contains('open');
    closeMoreMenus();
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}
document.addEventListener('click', closeMoreMenus);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMoreMenus(); });
async function createSession(){
  // Nom vide au départ : l'éditeur s'ouvre sans type présélectionné, pour inviter à choisir
  // Push/Pull/Legs/Upper (ou saisir un nom libre via "Autres").
  const s = {id:uid(), date:todayISO(), name:'', notes:'', entries:[], duration:null, kcal:null, hrAvg:null, hrMax:null, validated:false};
  state.sessions.push(s); await saveSessions(); renderNav(); openSessionEditor(s.id);
}
function formatDuration(min){
  if(min==null) return '';
  const h = Math.floor(min/60), m = Math.round(min%60);
  if(h<=0) return `${m} min`;
  return m>0 ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}
function makeEntry(exId, coopSession){
  const ex = state.exercises.find(e=>e.id===exId) || state.exercises[0];
  const base = {exerciseId:ex ? ex.id : '', exerciseName:ex ? ex.name : '', variant:ex ? (ex.defaultVariant||'') : '', pulley:'normal', sets:[{reps:0,weight:0}]};
  // En mode coop (N profils), chaque exercice est assigné par défaut à tous les participants
  // ('all'), avec un journal de séries indépendant par profil dans setsByUser — cf.

  if(coopSession && coopSession.coop){

      ? coopSession.coopParticipants
      : [coopSession.coopOwner, coopSession.coopPartner].filter(Boolean);
    base.setsByUser = {};
    participants.forEach(uid=>{ base.setsByUser[uid] = [{reps:0, weight:0}]; });
    if(participants[0]) base.sets = base.setsByUser[participants[0]];
    base.setsOther = participants[1] ? base.setsByUser[participants[1]] : [{reps:0,weight:0}];
    base.assign = 'all';

}
/* ============================= MODE COOP ============================= */
/* Active le mode coop sur une séance : elle devient une séance à deux, avec un journal de séries
   indépendant par profil pour chaque exercice (cf. makeEntry). "coopOwner" est le profil qui a
   activé le mode (celui dans le namespace duquel la séance vit tant qu'elle n'est pas scindée),
   "coopPartner" est l'autre profil. Les exercices déjà présents passent tous en assignation
   "both" et démarrent avec les séries déjà saisies côté propriétaire ; le partenaire repart
   d'une série vierge. */
/* Migration : convertit une séance coop stockée à l'ancien format (2 profils fixes,
   coopOwner/coopPartner, sets/setsOther) vers le nouveau format N profils
   (coopParticipants[], setsByUser{}) sans rien casser pour le code de rendu qui lit encore
   coopOwner/coopPartner/sets/setsOther (ces champs restent alimentés en parallèle tant que
   le rendu n'a pas été généralisé). Idempotente : ne touche rien si déjà migrée. */
function migrateCoopSession(s){
  if(!s || !s.coop) return s;
  if(!s.coopParticipants || !s.coopParticipants.length){
    s.coopParticipants = [s.coopOwner, s.coopPartner].filter(Boolean);
  }
  if(!s.coopOwner) s.coopOwner = s.coopParticipants[0];
  if(!s.coopPartner && s.coopParticipants.length>1) s.coopPartner = s.coopParticipants[1];
  s.entries.forEach(e=>{
    if(!e.setsByUser){
      e.setsByUser = {};
      if(s.coopOwner) e.setsByUser[s.coopOwner] = e.sets || [{reps:0,weight:0}];
      if(s.coopPartner) e.setsByUser[s.coopPartner] = e.setsOther || [{reps:0,weight:0}];
      // Profils au-delà des 2 premiers (rejoints via une future séance à N>2 participants) :
      // partent d'une série vierge tant qu'aucune saisie n'a eu lieu pour eux.
      s.coopParticipants.forEach(uid=>{ if(!e.setsByUser[uid]) e.setsByUser[uid] = [{reps:0,weight:0}]; });
    }
    if(e.assign === 'both') e.assign = 'all';
    if(typeof e.assign === 'string' && e.assign!=='all') e.assign = [e.assign];
    if(!Array.isArray(e.assign) && e.assign!=='all') e.assign = 'all';
    // Garde sets/setsOther pointés sur setsByUser pour le code pas encore généralisé.
    if(s.coopOwner) e.sets = e.setsByUser[s.coopOwner];
    if(s.coopPartner) e.setsOther = e.setsByUser[s.coopPartner];
  });
  return s;
}
/* Active le mode coop sur une séance pour N profils : elle devient une séance partagée, avec

function enableCoopMode(sid, participantIds){
  const s = state.sessions.find(x=>x.id===sid); if(!s) return;
  const users = loadUsers();
  const owner = currentUserId();
  let participants = Array.isArray(participantIds) ? participantIds.slice() : [];
  participants = participants.filter(id=>users.some(u=>u.id===id));
  if(!participants.includes(owner)) participants.unshift(owner);
  participants = [...new Set(participants)];
  if(participants.length<2){
    const fallbackPartner = users.find(u=>u.id!==owner);
    if(!fallbackPartner){ showToast("Crée un second profil pour activer le mode coop", 'bad'); return; }
    participants = [owner, fallbackPartner.id];
  }
  s.coop = true;
  s.coopParticipants = participants;
  s.coopOwner = participants[0];
  s.coopPartner = participants[1];
  s.entries.forEach(e=>{
    e.assign = 'all';
    const previousOwnerSets = (e.sets && e.sets.length) ? e.sets : [{reps:0, weight:0}];
    e.setsByUser = {};
    participants.forEach(uid=>{ e.setsByUser[uid] = [{reps:0, weight:0}]; });
    e.setsByUser[s.coopOwner] = previousOwnerSets;
    e.sets = e.setsByUser[s.coopOwner];
    e.setsOther = e.setsByUser[s.coopPartner];
  });
  saveSessions();
  renderSessionEditor(sid, null, true);
}
/* Termine le mode coop : la séance partagée est scindée en deux séances totalement indépendantes,
   une par profil, chacune écrite dans son propre historique namespacé (state.sessions par
   utilisateur). Chaque séance ne garde que ses propres exercices/séries — aucun champ ni référence
   ne relie plus les deux séances entre elles après coup. */
async function disableCoopMode(sid){
  const s = state.sessions.find(x=>x.id===sid); if(!s || !s.coop) return;
  migrateCoopSession(s);
  const participants = (s.coopParticipants && s.coopParticipants.length) ? s.coopParticipants : [s.coopOwner, s.coopPartner].filter(Boolean);
  if(!confirm(`Terminer le mode coop scinde la séance en ${participants.length} séances indépendantes, une par profil (chacune dans son propre historique). Continuer ?`)) return;
  const owner = s.coopOwner || participants[0];
  const users = loadUsers();
  const baseFields = {date:s.date, name:s.name, notes:s.notes||'', duration:s.duration!=null?s.duration:null, kcal:s.kcal!=null?s.kcal:null, hrAvg:s.hrAvg!=null?s.hrAvg:null, hrMax:s.hrMax!=null?s.hrMax:null};
  const buildEntriesFor = (participantId)=> s.entries
    .filter(e=> e.assign==='all' || (Array.isArray(e.assign) && e.assign.includes(participantId)))
    .map(e=>({exerciseId:e.exerciseId, exerciseName:e.exerciseName, variant:e.variant, pulley:e.pulley, sets: ((e.setsByUser && e.setsByUser[participantId]) || (participantId===owner ? e.sets : e.setsOther)) || [{reps:0,weight:0}]}));
  // Une séance indépendante par participant, chacune avec son propre id.
  const splitSessions = participants.map(participantId=>({
    participantId,
    session: {...baseFields, id: uid(), entries: buildEntriesFor(participantId)}
  }));
  const ownerSplit = splitSessions.find(x=>x.participantId===owner);
  // Séance du profil propriétaire : remplace la séance coop dans son propre historique (déjà chargé).
  state.sessions = state.sessions.map(x=> x.id===sid ? ownerSplit.session : x);
  await saveSessions();
  // Séances des autres participants : écrites directement dans leur namespace de stockage
  // respectif, sans jamais basculer le profil actif, pour qu'elles atterrissent chacune
  // dans l'historique de leur profil.
  for(const {participantId, session} of splitSessions){
    if(participantId===owner) continue;
    const list = (await readStored('sessions', participantId)) || [];
    list.push(session);
    await writeStored('sessions', list, participantId);
  }
  await closeModal();
  const names = participants.map(id=>(users.find(u=>u.id===id)||{}).name||'Profil').join(', ');
  showToast(`Séance scindée entre ${names}`, 'good');
  renderNav();
  renderSessionsView();
  if(state.currentView==='calendar') drawCalendarGrid();
  if(state.currentView==='dashboard') renderDashboard(); if(state.currentView==='home') renderHomeView();
}
// Scrolle un champ pour le garder visible une fois le clavier mobile ouvert.
// Un simple setTimeout fixe ne suffit pas car la durée d'ouverture du clavier varie selon
// l'appareil/navigateur : on écoute donc l'événement 'resize' de visualViewport (déclenché
// quand le clavier apparaît réellement), avec un délai de secours si l'API est indisponible
// ou si le clavier était déjà ouvert (donc pas de resize à attendre).
function scrollFieldIntoViewWhenReady(el){
  if(!el) return;
  const doScroll = ()=>{ el.scrollIntoView({block:'center', behavior:'smooth'}); };
  if(window.visualViewport){
    let done = false;
    const finish = ()=>{
      if(done) return;
      done = true;
      window.visualViewport.removeEventListener('resize', finish);
      doScroll();
    };
    window.visualViewport.addEventListener('resize', finish);
    // Filet de sécurité : si aucun resize ne survient (desktop, clavier déjà ouvert…), on scrolle quand même.
    setTimeout(finish, 400);
  } else {
    setTimeout(doScroll, 350);
  }
}

async function persistSessionEditor(sid){
  const s = state.sessions.find(x=>x.id===sid); if(!s || !document.getElementById('session-date')) return;

  const durationHEl = document.getElementById('session-duration-h'), durationMEl = document.getElementById('session-duration-m'), kcalEl = document.getElementById('session-kcal'), hrAvgEl = document.getElementById('session-hravg'), hrMaxEl = document.getElementById('session-hrmax');

  // pas scindée) : on laisse alors les valeurs déjà stockées intactes plutôt que de les écraser à vide.
  if(durationHEl || durationMEl){
    const durH = durationHEl && durationHEl.value!=='' ? Number(durationHEl.value) : 0;
    const durM = durationMEl && durationMEl.value!=='' ? Number(durationMEl.value) : 0;
    s.duration = (durationHEl && durationHEl.value!=='') || (durationMEl && durationMEl.value!=='') ? (durH*60 + durM) : null;
  }
  if(kcalEl) s.kcal = kcalEl.value!=='' ? Number(kcalEl.value) : null;
  if(hrAvgEl) s.hrAvg = hrAvgEl.value!=='' ? Number(hrAvgEl.value) : null;
  if(hrMaxEl) s.hrMax = hrMaxEl.value!=='' ? Number(hrMaxEl.value) : null;
  // Une fois la séance validée, les exercices sont affichés en lecture seule (plus de champs
  // [data-entry-exercise] dans le DOM) : on ne doit surtout pas écraser s.entries avec un tableau vide.
  if(s.validated) { await saveSessions(); renderNav(); return; }
  s.entries = Array.from(document.querySelectorAll('[data-entry-exercise]')).map((sel,i)=>{
    const ex=state.exercises.find(x=>x.id===sel.value), pulleyEl=document.querySelector(`[data-entry-pulley="${i}"]`);
    const variantEl = document.querySelector(`[data-entry-variant="${i}"]`);

    // after switching exercise, before this entry's card re-renders with the new exercise's own variant
    // options). Validate it against the actual exercise now selected, falling back to its default variant,
    // so a stale variant never gets saved and never breaks the "dernière fois / PR" lookup for the new exercise.
    let variant = variantEl ? variantEl.value : '';

      const setsByUser = {};

        const inputs = Array.from(document.querySelectorAll(`[data-coop-reps^="${i}-${pid}-"]`));
        setsByUser[pid] = inputs.length
          ? inputs.map((r,j)=>({reps:Number(r.value)||0, weight:Number(document.querySelector(`[data-coop-weight="${i}-${pid}-${j}"]`).value)||0}))
          : (prevEntry && prevEntry.setsByUser && prevEntry.setsByUser[pid]) || [{reps:0,weight:0}];
      });
      const owner = s.coopOwner || participants[0], partner = s.coopPartner || participants[1];
      return {exerciseId:sel.value, exerciseName:ex?ex.name:'Exercice', variant, pulley:pulleyEl?pulleyEl.value:'normal', assign:(prevEntry && prevEntry.assign)||'all', setsByUser, sets: setsByUser[owner]||[{reps:0,weight:0}], setsOther: partner ? (setsByUser[partner]||[{reps:0,weight:0}]) : [{reps:0,weight:0}]};
    }
    return {exerciseId:sel.value, exerciseName:ex?ex.name:'Exercice', variant, pulley:pulleyEl?pulleyEl.value:'normal', sets:Array.from(document.querySelectorAll(`[data-set-reps^="${i}-"]`)).map((r,j)=>({reps:Number(r.value)||0,weight:Number(document.querySelector(`[data-set-weight="${i}-${j}"]`).value)||0}))};

function buildSessionTxt(s){
  const watchLines = [];
  if(s.duration!=null) watchLines.push(`Durée : ${formatDuration(s.duration)}`);
  if(s.kcal!=null) watchLines.push(`Kcal : ${s.kcal}`);
  if(s.hrAvg!=null) watchLines.push(`FC moyenne : ${s.hrAvg} bpm`);
  if(s.hrMax!=null) watchLines.push(`FC max : ${s.hrMax} bpm`);
  return `${s.name}\n${s.date}\n\n`+(watchLines.length?watchLines.join('\n')+'\n\n':'')+s.entries.map(e=>`${e.exerciseName}${e.variant?' — '+e.variant:''}${(state.exercises.find(x=>x.id===e.exerciseId)||{}).isCable?' ('+PULLEYS[e.pulley||'normal']+')':''}\n${e.sets.map(st=>`${st.reps} x ${st.weight} kg`).join('\n')}`).join('\n\n')+(s.notes?`\n\nNotes : ${s.notes}`:'');
}
function downloadSession(sid, format){
  const s=state.sessions.find(x=>x.id===sid); if(!s) return;
  const json={date:s.date, nom:s.name, notes:s.notes||'', duree_min:s.duration!=null?s.duration:null, kcal:s.kcal!=null?s.kcal:null, fc_moyenne:s.hrAvg!=null?s.hrAvg:null, fc_max:s.hrMax!=null?s.hrMax:null, exercises:s.entries.map(e=>({nom:e.exerciseName,variante:e.variant||'',poulie:PULLEYS[e.pulley||'normal'],series:e.sets.map(st=>({reps:st.reps,poids:st.weight}))}))};
  const content=format==='txt' ? buildSessionTxt(s) : JSON.stringify(json,null,2);

  // (é, è, à, …) quand le fichier est rouvert dans certains éditeurs (ex: Bloc-notes Windows).
  const blob=new Blob(['\ufeff'+content],{type:format==='txt'?'text/plain;charset=utf-8':'application/json;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=`fonte-${slugify(s.name||'seance')}-${s.date}.${format}`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function copySessionTxt(sid){
  const s=state.sessions.find(x=>x.id===sid); if(!s) return;

/* ===== Filtres avancés (Lot 1) — la poulie et la variante sont deux critères DISTINCTS : "Matrix" peut être
   un type de poulie (entry.pulley) ET/OU le nom d'une variante (entry.variant). Ne jamais les confondre. ===== */
let exF = {muscles:[],muscleAnd:false,pulleys:[],variants:[],variantSrc:'used',status:'__all__',scope:'active'};
let exAllSessions = null;
function exBuildIndex(){
  const src = (exF.scope==='all' && exAllSessions) ? exAllSessions : state.sessions;
  const byId = {}; state.exercises.forEach(e=>byId[e.id]=e);
  const idx = {};
  src.forEach(s=>(s.entries||[]).forEach(en=>{
    const ex = byId[en.exerciseId]; if(!ex) return;
    const r = idx[ex.id] || (idx[ex.id] = {count:0,last:'',pul:{},vari:{},vp:{}});
    r.count++; if(s.date>r.last) r.last=s.date;
    const v = en.variant||'';
    if(v) r.vari[v]=(r.vari[v]||0)+1;
    if(ex.isCable){ const p=en.pulley||'normal'; r.pul[p]=(r.pul[p]||0)+1; r.vp[v+'\u0001'+p]=1; }
  }));
  return idx;
}
/* Contexte des filtres actifs : un critère n'est repris pour l'historique que s'il est sans ambiguïté (une seule valeur choisie). */
function exCtxVariant(){ const v=exF.variants.filter(x=>x!=='__none__'); return v.length===1 ? v[0] : undefined; }
function exCtxPulley(){ const p=exF.pulleys.filter(x=>x!=='__none__'&&x!=='__cable__'); return p.length===1 ? p[0] : undefined; }
function exActiveCount(){
  return (exSearchQuery.trim()?1:0)+exF.muscles.length+exF.pulleys.length+(exF.variants.length?1:0)+(exF.status!=='__all__'?1:0)+(exF.scope!=='active'?1:0)+(exFilterUnclassified?1:0);
}
function exFilteredList(idx){
  const nameCounts = {}; state.exercises.forEach(e=>{ const k=normalizeExerciseName(e.name); nameCounts[k]=(nameCounts[k]||0)+1; });
  const isDup = e=> nameCounts[normalizeExerciseName(e.name)]>1;
  const q = exSearchQuery.trim() ? exSearchQuery.trim().split(/\s+/).map(normalizeExerciseName).filter(Boolean) : [];
  const today = todayISO();
  const list = state.exercises.filter(e=>{
    const u = idx[e.id] || {count:0,last:'',pul:{},vari:{},vp:{}};
    if(exFilterUnclassified && e.classified && e.muscles.length) return false;
    if(q.length){ const hay = normalizeExerciseName(e.name)+' '+e.variants.map(normalizeExerciseName).join(' '); if(!q.every(w=>hay.includes(w))) return false; }
    if(exF.muscles.length){
      const has = m=> m==='__none__' ? (!e.classified || !e.muscles.length) : e.muscles.includes(m);
      if(!(exF.muscleAnd ? exF.muscles.every(has) : exF.muscles.some(has))) return false;
    }
    const P = exF.pulleys, vSel = exF.variants;
    const types = P.filter(p=>p!=='__cable__' && p!=='__none__');
    const comboDone = types.length>0 && vSel.length>0 && exF.variantSrc==='used' && types.length===P.length;
    if(P.length){
      const ok = P.some(p=> p==='__none__' ? !e.isCable : p==='__cable__' ? e.isCable : (e.isCable && (comboDone ? vSel.some(v=>u.vp[v+'\u0001'+p]) : u.pul[p]>0)));
      if(!ok) return false;
    }
    if(vSel.length && !comboDone){
      const pool = exF.variantSrc==='used' ? Object.keys(u.vari) : e.variants;
      if(!vSel.some(v=> v==='__none__' ? (exF.variantSrc==='used' ? !Object.keys(u.vari).length : !e.variants.length) : pool.includes(v))) return false;
    }
    if(exF.status==='classed' && !(e.classified && e.muscles.length)) return false;
    if(exF.status==='todo' && (e.classified && e.muscles.length)) return false;
    if(exF.status==='dup' && !isDup(e)) return false;
    return true;
  });
  return {list, isDup};
}

function sortArrow(key){
  if(exSortKey!==key) return '<span style="opacity:0.25;">↕</span>';
  return exSortDir==='asc' ? '↑' : '↓';
}
function renderExercisesTable(list, idx, isDup){
  list = list.slice();
  const U = e=> idx[e.id] || {count:0,last:'',pul:{},vari:{},vp:{}};
  const first = e=> e.muscles.length?muscleInfo(e.muscles[0]).label:'\uffff';
  const dir = exSortDir==='asc' ? 1 : -1;
  const sorters = {
    name:(a,b)=>a.name.localeCompare(b.name),
    muscles:(a,b)=>first(a).localeCompare(first(b))||a.name.localeCompare(b.name),
    variants:(a,b)=>a.variants.length-b.variants.length||a.name.localeCompare(b.name),
    pulleys:(a,b)=>Object.keys(U(a).pul).length-Object.keys(U(b).pul).length||a.name.localeCompare(b.name),
    last:(a,b)=>U(a).last.localeCompare(U(b).last)||a.name.localeCompare(b.name),
    usage:(a,b)=>U(a).count-U(b).count||a.name.localeCompare(b.name),
    status:(a,b)=>Number(a.classified&&a.muscles.length>0)-Number(b.classified&&b.muscles.length>0)||a.name.localeCompare(b.name)
  };
  list.sort((a,b)=>dir*(sorters[exSortKey]?sorters[exSortKey](a,b):sorters.name(a,b)));
  if(!list.length) return emptyState('M4 12h16M4 8v8M20 8v8M2 10v4M22 10v4','Rien ici', exActiveCount()? 'Aucun exercice ne correspond à ces filtres. Retire-en un pour élargir.' : 'Aucun exercice.');

    return `<tr class="clickable" data-ex="${e.id}">

      <td data-label="Variantes">${sv.length? sv.map(v=>`<span class="chip outline" ${u.vari[v]>0?`data-ex-var="${e.id}" data-variant="${escapeHtml(v)}" title="Voir l'historique avec cette variante"`:''} style="${u.vari[v]>0?'cursor:pointer;':''}${vHi(v)?'border-color:var(--accent);color:var(--text,#fff);':''}">${escapeHtml(v)}${e.defaultVariant===v?' ★':''}</span>`).join(' ') : '<span style="color:var(--muted-2);">Aucune</span>'}</td>

function renameVariantChip(el){
  const chip = el.parentElement;
  if(chip.querySelector('.variant-edit-input')) return; // already editing
  const current = chip.dataset.variant;
  const labelSpan = chip.querySelector('.label');
  const input = document.createElement('input');
  input.type = 'text'; input.value = current; input.className = 'variant-edit-input';
  input.style.cssText = 'width:120px;font-size:12px;padding:2px 6px;border-radius:6px;';
  labelSpan.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const commit = ()=>{
    if(done) return; done = true;
    const val = input.value.trim() || current;
    chip.dataset.variant = val;
    const newLabel = document.createElement('span');
    newLabel.className = 'label'; newLabel.textContent = val;
    input.replaceWith(newLabel);
    const defSel = document.getElementById('ex-default-variant');
    const opt = Array.from(defSel.options).find(o=>o.value===current);
    if(opt){ opt.value = val; opt.textContent = val; }
  };
  input.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
    if(ev.key==='Escape'){ ev.preventDefault(); input.value = current; input.blur(); }
  });
  input.addEventListener('blur', commit);
}
function mergeExercisesCore(sourceId, targetId){
  const target = state.exercises.find(x=>x.id===targetId);
  if(!target || sourceId===targetId) return;
  state.sessions.forEach(s=>{
    s.entries.forEach(e=>{
      if(e.exerciseId===sourceId){
        e.exerciseId = targetId;
        e.exerciseName = target.name;
        if(e.variant && !target.variants.includes(e.variant)) target.variants.push(e.variant);
      }
    });
  });
  state.exercises = state.exercises.filter(x=>x.id!==sourceId);
}
async function mergeExercises(sourceId, targetId){
  mergeExercisesCore(sourceId, targetId);
  await saveExercises();
  await saveSessions();
  closeModal();
  showToast('Exercices fusionnés', 'good');
  renderNav();
  if(state.currentView==='exercises') renderExercisesView();
}
function removeVariantChip(el){ el.parentElement.remove(); }
function removePulleyTypeChip(el){

async function saveExerciseFromModal(existingId){
  const name = document.getElementById('ex-name').value.trim();
  if(!name){ showToast('Le nom est obligatoire', 'bad'); return; }
  const muscles = Array.from(document.querySelectorAll('#ex-muscles .chip-toggle.active')).map(c=>c.dataset.muscle);
  const variantChips = Array.from(document.querySelectorAll('#ex-variants-list .chip'));
  const variants = variantChips.map(c=>c.dataset.variant);
  const variantRenames = variantChips.filter(c=>c.dataset.original && c.dataset.original!==c.dataset.variant).map(c=>({from:c.dataset.original, to:c.dataset.variant}));
  const defaultVariant = document.getElementById('ex-default-variant').value;
  const isCable = document.getElementById('ex-is-cable').checked;

  let sessionsChanged = false;
  let hadVariantsBefore = false;
  if(existingId){
    const ex = state.exercises.find(e=>e.id===existingId);
    const oldName = ex.name;
    hadVariantsBefore = ex.variants.length>0;
    ex.name = name; ex.muscles = muscles; ex.variants = variants; ex.defaultVariant = variants.includes(defaultVariant)?defaultVariant:''; ex.isCable=isCable; ex.classified = muscles.length>0;
    if(oldName !== name || variantRenames.length){
      state.sessions.forEach(s=>{
        s.entries.forEach(e=>{
          if(e.exerciseId===existingId){
            if(oldName!==name){ e.exerciseName = name; sessionsChanged = true; }
            const r = variantRenames.find(r=>r.from===e.variant);
            if(r){ e.variant = r.to; sessionsChanged = true; }
          }
        });
      });
    }
  } else {
    let id = slugify(name);
    if(state.exercises.find(e=>e.id===id)) id = id+'-'+uid().slice(0,4);
    state.exercises.push({id, name, muscles, variants, defaultVariant: variants.includes(defaultVariant)?defaultVariant:'', isCable, classified: muscles.length>0});
  }
  await saveExercises();
  if(sessionsChanged) await saveSessions();
  renderNav();
  renderExercisesView();
  if(state.currentView==='dashboard') renderDashboard(); if(state.currentView==='home') renderHomeView();

  // Un exercice qui vient de recevoir sa toute première variante : toute séance existante qui l'utilise
  // sans variante précisée devient ambiguë (on ne sait plus laquelle des nouvelles variantes elle représente).
  // On force donc à préciser une variante pour chacune de ces séances avant de considérer l'édition terminée.
  const justGotFirstVariant = existingId && !hadVariantsBefore && variants.length>0;
  if(justGotFirstVariant && (await entriesMissingVariant(existingId)).length>0){
    showToast(sessionsChanged ? 'Exercice et séances liées mis à jour' : 'Exercice enregistré', 'good');
    await openAssignVariantsModal(existingId);
  } else {
    closeModal();
    showToast(sessionsChanged ? 'Exercice et séances liées mis à jour' : 'Exercice enregistré', 'good');
  }
}
/* Liste les entrées de séance (exercice+index) qui utilisent exId sans variante précisée — sert à repérer
   les séances devenues ambiguës quand un exercice reçoit sa première variante, ou les cas hérités d'un
   import/backup où la variante n'a jamais été renseignée.
   Les exercices sont globaux (partagés entre tous les profils) mais les séances sont propres à chaque
   profil : on doit donc parcourir les séances de TOUS les profils, pas seulement celles du profil actif,
   sinon des séances ambiguës appartenant à un autre profil resteraient invisibles indéfiniment. */
async function entriesMissingVariant(exId){
  const users = loadUsers();
  const list = [];
  for(const u of users){
    const sessions = (u.id === currentUserId()) ? state.sessions : (await readStored('sessions', u.id) || []);
    sessions.forEach(s=>{
      s.entries.forEach((e,i)=>{
        if(e.exerciseId===exId && !e.variant) list.push({sessionId:s.id, entryIndex:i, date:s.date, name:s.name, userId:u.id, userName:u.name});
      });
    });
  }
  return list.sort((a,b)=>b.date.localeCompare(a.date));
}

          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span class="mono" style="font-size:12px;color:var(--muted);flex-shrink:0;">${fmtDateShort(m.date)}</span>
            ${sessionBadge(m.name, 'sm')}
            ${multiUser?`<span style="font-size:11px;color:var(--muted-2);flex-shrink:0;border:1px solid var(--border);border-radius:6px;padding:1px 6px;">${escapeHtml(m.userName||'')}</span>`:''}
          </div>
          <select class="assign-variant-select" style="max-width:220px;">
            <option value="">— Choisir une variante —</option>
            ${ex.variants.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions-sticky">
      <div></div>
      <button class="btn primary" id="assign-variant-save">Valider</button>
    </div>
  `);
  document.getElementById('assign-variant-bulk-btn').addEventListener('click', ()=>{
    const val = document.getElementById('assign-variant-bulk').value;
    if(!val){ showToast('Choisis d\'abord une variante à appliquer', 'bad'); return; }
    document.querySelectorAll('#assign-variant-list .assign-variant-select').forEach(sel=>{ sel.value = val; });
  });
  document.getElementById('assign-variant-save').addEventListener('click', async ()=>{
    const rows = Array.from(document.querySelectorAll('#assign-variant-list [data-session-id]'));
    const unset = rows.filter(r=>!r.querySelector('.assign-variant-select').value);
    if(unset.length){ showToast('Choisis une variante pour chaque séance listée', 'bad'); return; }
    // On regroupe les lignes par profil : les séances du profil actif se mettent à jour directement
    // dans state.sessions, celles des autres profils sont rechargées/réécrites via readStored/writeStored
    // sans jamais passer par state (qui ne représente que le profil actif).
    const byUser = new Map();
    rows.forEach(row=>{
      const userId = row.dataset.userId || currentUserId();
      if(!byUser.has(userId)) byUser.set(userId, []);
      byUser.get(userId).push({
        sessionId: row.dataset.sessionId,
        entryIndex: parseInt(row.dataset.entryIndex, 10),
        value: row.querySelector('.assign-variant-select').value
      });
    });
    for(const [userId, edits] of byUser.entries()){
      if(userId === currentUserId()){
        edits.forEach(({sessionId, entryIndex, value})=>{
          const s = state.sessions.find(s=>s.id===sessionId);
          if(s && s.entries[entryIndex]) s.entries[entryIndex].variant = value;
        });
        await saveSessions();
      } else {
        const sessions = await readStored('sessions', userId) || [];
        edits.forEach(({sessionId, entryIndex, value})=>{
          const s = sessions.find(s=>s.id===sessionId);
          if(s && s.entries[entryIndex]) s.entries[entryIndex].variant = value;
        });
        await writeStored('sessions', sessions, userId);
      }
    }
    closeModal();
    showToast('Variantes assignées', 'good');
    renderExercisesView();
    if(state.currentView==='dashboard') renderDashboard(); if(state.currentView==='home') renderHomeView();
  });
}

/* ---------- Prompt IA (rapprochement des exercices) ---------- */
function buildExerciseListForPrompt(){
  if(!state.exercises.length) return "(aucun exercice enregistré pour l'instant — l'IA devra inventer les noms)";
  return state.exercises.map(e=>{
    let line = `- ${e.name}`;
    if(e.isCable) line += ' [exercice à la poulie]';
    if(e.variants && e.variants.length) line += ` — variantes existantes : ${e.variants.join(', ')}`;
    if(e.defaultVariant) line += ` (variante par défaut : ${e.defaultVariant})`;
    return line;
  }).join('\n');
}
function buildAIPrompt(rawNotes){
  const schema = JSON.stringify({
    date: "YYYY-MM-DD",
    nom: "Nom de la séance",
    notes: "",
    duree_min: "(optionnel, durée totale de la séance en minutes — nombre entier, ou omets/null si non renseignée)",
    kcal: "(optionnel, calories brûlées pendant la séance — nombre entier, ou omets/null si non renseigné)",
    fc_moyenne: "(optionnel, fréquence cardiaque moyenne en bpm — nombre entier, ou omets/null si non renseignée)",
    fc_max: "(optionnel, fréquence cardiaque max en bpm — nombre entier, ou omets/null si non renseignée)",
    exercises: [
      { nom: "Nom exact de l'exercice", variante: "(optionnel, vide si aucune)", poulie: "Poulies normales | Nouvelles poulies | Machine double poulie MATRIX (uniquement si l'exercice est à la poulie, sinon omets ce champ)", series: [{reps: 10, poids: 20}] }
    ]
  }, null, 2);
  return `Tu convertis une séance de musculation décrite en texte libre en JSON, dans le format attendu par mon appli de suivi "FONTE".

FORMAT JSON ATTENDU (un seul objet séance, ou un tableau d'objets si plusieurs séances) :
${schema}

RÈGLES IMPORTANTES :
- Utilise EXACTEMENT le nom et la variante d'un exercice existant ci-dessous quand ta séance correspond à l'un d'eux (fais le rapprochement même si la formulation, l'ordre des mots ou l'orthographe diffère légèrement).
- N'invente une nouvelle variante que si aucune variante existante ne correspond.
- Si un exercice ne correspond à aucun de la liste, crée un nom clair, cohérent avec le style des autres noms de la liste.
- Le champ "poulie" ne doit apparaître QUE pour un exercice marqué [exercice à la poulie] ci-dessous (ou si mes notes précisent explicitement une poulie) ; les valeurs possibles sont exactement "Poulies normales", "Nouvelles poulies" ou "Machine double poulie MATRIX".
- Si mes notes mentionnent des données de montre connectée (durée de la séance, calories brûlées, fréquence cardiaque moyenne et/ou max), reporte-les dans les champs "duree_min", "kcal", "fc_moyenne" et "fc_max". N'invente jamais ces valeurs : si une donnée n'est pas mentionnée, omets le champ ou mets-le à null.
- Réponds UNIQUEMENT avec le JSON final, sans texte autour, sans balises markdown, sans commentaire.

LISTE DE MES EXERCICES CONNUS (à réutiliser en priorité) :
${buildExerciseListForPrompt()}

Voici mes notes de séance à convertir :
"""
${rawNotes || '(colle ici tes notes de séance)'}
"""`;
}

async function copyTextToClipboard(text, successMsg){
  successMsg = successMsg || 'Prompt copié dans le presse-papier';
  try{
    await navigator.clipboard.writeText(text);
    showToast(successMsg, 'good');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove();
      showToast(successMsg, 'good');
    }catch(e2){
      showToast("Impossible de copier automatiquement — utilise l'aperçu pour copier à la main", 'bad');
    }
  }
}

function normalizeSessionObj(raw){
  const dateVal = raw.date || raw.jour || todayISO();
  const nameVal = raw.nom || raw.name || 'Séance';
  const notes = raw.notes || raw.note || '';
  const exercisesArr = raw.exercises || raw.exercices || [];
  const numOrNull = v => (v===undefined || v===null || v==='') ? null : Number(v);
  const duration = numOrNull(raw.duree_min ?? raw.duration ?? raw.duree);
  const kcal = numOrNull(raw.kcal ?? raw.calories);
  const hrAvg = numOrNull(raw.fc_moyenne ?? raw.hrAvg ?? raw.hr_avg);
  const hrMax = numOrNull(raw.fc_max ?? raw.hrMax ?? raw.hr_max);
  return {date: dateVal, name: nameVal, notes, exercisesArr, duration, kcal, hrAvg, hrMax};
}
function analyzeImport(){
  const raw = document.getElementById('import-textarea').value.trim();
  if(!raw){ showToast("Colle d'abord du JSON", 'bad'); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ document.getElementById('import-preview').innerHTML = `<div class="empty"><div class="t" style="color:var(--bad);">JSON invalide</div><div>${escapeHtml(e.message)}</div></div>`; return; }

  const items = Array.isArray(parsed) ? parsed : [parsed];
  const tempExercises = JSON.parse(JSON.stringify(state.exercises));
  const originalIds = new Set(state.exercises.map(e=>e.id));
  const newExerciseNames = [];
  const newVariantPairs = [];
  const sessionsToAdd = [];
  const errors = [];

  items.forEach((raw2, idx)=>{
    try{
      const {date, name, notes, exercisesArr, duration, kcal, hrAvg, hrMax} = normalizeSessionObj(raw2);
      if(!Array.isArray(exercisesArr) || exercisesArr.length===0){ errors.push(`Élément ${idx+1} : aucun exercice trouvé`); return; }
      const entries = [];
      const entryIndexByKey = new Map();
      exercisesArr.forEach(item=>{
        const exName = (item.nom || item.name || '').trim();
        if(!exName) throw new Error("un exercice n'a pas de nom");
        let variant = (item.variante || item.variant || '').trim() || null;
        const explicitPulley = pulleyFromValue(item.poulie || item.pulley);
        /* Une variante n'est convertie en poulie (ancien comportement) que si rien n'indique qu'il s'agit d'une vraie variante :
           pas de champ "poulie" explicite, exercice inconnu ou à la poulie, et variante non déjà déclarée sur l'exercice. */
        const knownEx = tempExercises.find(e=>normalizeExerciseName(e.name)===normalizeExerciseName(exName));
        const keepAsVariant = !!explicitPulley || !!(knownEx && (!knownEx.isCable || knownEx.variants.includes(variant)));
        const variantPulley = keepAsVariant ? null : pulleyFromValue(variant);
        const pulley = explicitPulley || variantPulley || 'normal';
        if(variantPulley) variant = null;
        const seriesArr = item.series || item.sets || [];
        const sets = seriesArr.map(s=>({ reps: Number(s.reps ?? s.repetitions ?? 0), weight: Number(s.poids ?? s.weight ?? s.charge ?? 0) }));

        const normName = normalizeExerciseName(exName);
        let ex = tempExercises.find(e=>normalizeExerciseName(e.name)===normName);
        if(!ex){
          let id = slugify(exName);
          if(tempExercises.find(e=>e.id===id)) id = id+'-'+uid().slice(0,4);
          ex = {id, name: exName, muscles:[], classified:false, variants:[], defaultVariant:'', isCable:!!(explicitPulley||variantPulley)};
          tempExercises.push(ex);
          if(!newExerciseNames.includes(exName)) newExerciseNames.push(exName);
        }
        if(!variant && ex.defaultVariant) variant = ex.defaultVariant;
        // Important : on ne modifie JAMAIS ex.isCable pour un exercice déjà existant — c'est une
        // config explicite de l'utilisateur (case "Exercice à la poulie" dans la fiche exercice).
        // L'import ne doit que COMPLÉTER (ex: ajouter une variante manquante), jamais écraser un
        // réglage existant. isCable n'est déduit qu'à la CRÉATION d'un nouvel exercice (ci-dessus).
        if(variant && !ex.variants.includes(variant)){
          ex.variants.push(variant);
          newVariantPairs.push(`${exName} — ${variant}`);
        }
        // Si le même exercice (même variante/poulie) apparaît plusieurs fois dans la séance
        // importée, on ajoute ses séries à la suite de l'entrée existante plutôt que de créer
        // une nouvelle entrée en double.
        const key = ex.id+'|'+(variant||'')+'|'+pulley;
        if(entryIndexByKey.has(key)){
          entries[entryIndexByKey.get(key)].sets.push(...sets);
        } else {
          entryIndexByKey.set(key, entries.length);
          entries.push({exerciseId: ex.id, exerciseName: ex.name, variant, pulley, sets});
        }
      });
      sessionsToAdd.push({id: uid(), date, name, notes, duration, kcal, hrAvg, hrMax, validated:false, entries});
    }catch(e){
      errors.push(`Élément ${idx+1} : ${e.message}`);
    }
  });

  lastAnalysis = {sessionsToAdd, tempExercises, newExerciseNames, newVariantPairs, errors};
  renderImportPreview();
}
function renderImportPreview(){
  const a = lastAnalysis;
  const box = document.getElementById('import-preview');
  if(!a || a.sessionsToAdd.length===0){
    box.innerHTML = `<div class="empty"><div class="t" style="color:var(--bad);">Aucune séance valide</div><div>${a && a.errors.length? a.errors.map(escapeHtml).join('<br>') : "Vérifie le format du JSON."}</div></div>`;
    return;
  }
  box.innerHTML = `
    ${a.sessionsToAdd.map(s=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;"><strong>${fmtDateFR(s.date)}</strong>${sessionBadge(s.name, 'sm')}</div>
        <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
        ${s.entries.map(e=>`<div style="font-size:12.5px;color:var(--muted);">
          ${a.newExerciseNames.includes(e.exerciseName)? '<span class="badge warn">NOUVEAU</span> ' : ''}
          <strong style="color:var(--text);">${escapeHtml(e.exerciseName)}</strong>${e.variant?` — ${escapeHtml(e.variant)}`:''}

        </div>
      </div>
    `).join('')}
    ${a.newExerciseNames.length? `<div style="margin-top:10px;font-size:12.5px;color:var(--warn);">⚠ ${a.newExerciseNames.length} nouvel/nouveaux exercice(s) seront ajoutés non classés — pense à les classer dans l'onglet Exercices.</div>` : ''}
    ${a.errors.length? `<div style="margin-top:10px;font-size:12px;color:var(--bad);">${a.errors.map(escapeHtml).join('<br>')}</div>` : ''}
    <button class="btn primary" style="margin-top:14px;width:100%;" id="confirm-import-btn">Confirmer l'import (${a.sessionsToAdd.length} séance${a.sessionsToAdd.length>1?'s':''})</button>
  `;
  document.getElementById('confirm-import-btn').addEventListener('click', confirmImport);
}
async function confirmImport(){
  if(!lastAnalysis || lastAnalysis.sessionsToAdd.length===0) return;
  state.exercises = lastAnalysis.tempExercises;
  state.sessions = state.sessions.concat(lastAnalysis.sessionsToAdd);
  await saveExercises();
  await saveSessions();
  showToast(`${lastAnalysis.sessionsToAdd.length} séance(s) importée(s)`, 'good');
  const hadNew = lastAnalysis.newExerciseNames.length>0;
  document.getElementById('import-textarea').value='';
  document.getElementById('import-preview').innerHTML = emptyState('M12 3v12m0-12l-4 4m4-4l4 4M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3','En attente','Analyse ton JSON pour voir ce qui sera importé.');
  lastAnalysis = null;
  renderNav();
  if(hadNew){ switchView('exercises'); exFilterUnclassified = true; renderExercisesView(); }
}
