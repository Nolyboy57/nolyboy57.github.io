/* ============================= SYNCHRO GOOGLE DRIVE ============================= */
// Un seul fichier JSON (fonte-sync.json) créé par l'appli sur le Drive de l'utilisateur (portée drive.file).
// Synchro manuelle : « Envoyer » et « Récupérer », avec garde-fous contre les écrasements involontaires.
const DRIVE_CLIENT_ID = '687638705532-l7jm7268a6r2pd6h559npodl5puk4r1p.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME = 'fonte-sync.json';
const DRIVE_META_KEY = STORAGE_PREFIX + 'drive-meta'; // { fileId, remoteModified, syncedAt }
let driveToken = null, driveTokenExp = 0, driveBusy = false;
function loadDriveMeta(){ try{ return JSON.parse(localStorage.getItem(DRIVE_META_KEY)) || {}; }catch(e){ return {}; } }
function saveDriveMeta(m){ try{ localStorage.setItem(DRIVE_META_KEY, JSON.stringify(m)); }catch(e){} }
function driveDateFr(iso){ try{ return new Date(iso).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}); }catch(e){ return String(iso); } }
function updateDriveStatus(){
  const n = document.getElementById('drive-status');
  if(!n) return;
  const m = loadDriveMeta();
  n.textContent = m.syncedAt ? `Dernière synchro de cet appareil : ${driveDateFr(m.syncedAt)}` : "Cet appareil n'a pas encore été synchronisé avec Drive.";
}
function setDriveBusy(b){ ['drive-push-btn','drive-pull-btn'].forEach(id=>{ const n = document.getElementById(id); if(n) n.disabled = b; }); }
function driveGetToken(){
  // À appeler en premier dans le gestionnaire du clic (le navigateur bloque les fenêtres Google sinon).
  if(driveToken && Date.now() < driveTokenExp - 60000) return Promise.resolve(driveToken);
  return new Promise((resolve, reject)=>{
    if(!(window.google && google.accounts && google.accounts.oauth2)) return reject(new Error('service Google indisponible (connexion Internet ?)'));
    const client = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE,
      callback: r=>{
        if(r.error) return reject(new Error(r.error));
        driveToken = r.access_token; driveTokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
        resolve(driveToken);
      },
      error_callback: e=> reject(new Error((e && e.type) || 'connexion annulée'))
    });
    client.requestAccessToken({prompt:''});
  });
}
async function driveApi(url, opts){
  const o = opts || {};
  const r = await fetch(url, {...o, headers:{...(o.headers || {}), Authorization:'Bearer ' + driveToken}});
  if(r.status === 401){ driveToken = null; throw new Error('session Google expirée, réessaie'); }
  if(!r.ok) throw new Error('Drive HTTP ' + r.status);
  return r;
}
async function driveFindFile(){
  const meta = loadDriveMeta();
  if(meta.fileId){
    try{
      const f = await (await driveApi(`https://www.googleapis.com/drive/v3/files/${meta.fileId}?fields=id,modifiedTime,trashed`)).json();
      if(!f.trashed) return f;
    }catch(e){ if(!/404/.test(e.message)) throw e; }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const j = await (await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)`)).json();
  return (j.files && j.files[0]) || null;
}
async function drivePush(){
  if(driveBusy) return;
  driveBusy = true; setDriveBusy(true);
  try{
    await driveGetToken();
    const file = await driveFindFile();
    const meta = loadDriveMeta();
    if(file && (!meta.remoteModified || file.modifiedTime > meta.remoteModified)){
      const msg = meta.remoteModified
        ? `Le fichier Drive a été modifié le ${driveDateFr(file.modifiedTime)}, après la dernière synchro de cet appareil (${driveDateFr(meta.syncedAt)}). Un autre appareil a peut-être envoyé des séances plus récentes. Les écraser avec les données de cet appareil ?`
        : `Un fichier de synchro existe déjà sur Drive (modifié le ${driveDateFr(file.modifiedTime)}) et cet appareil ne l'a jamais synchronisé. L'écraser avec les données de cet appareil ?`;
      if(!confirm(msg)) return;
    }
    const body = JSON.stringify(await buildGlobalBackupPayload(), null, 2);
    let res;
    if(file){
      res = await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media&fields=id,modifiedTime`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
    } else {
      const b = '-----fonte' + Date.now();
      const multipart = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:DRIVE_FILE_NAME, mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      res = await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body: multipart});
    }
    const f = await res.json();
    saveDriveMeta({fileId:f.id, remoteModified:f.modifiedTime, syncedAt:new Date().toISOString()});
    showToast('Données envoyées vers Drive', 'good');
  }catch(e){
    showToast('Envoi Drive impossible : ' + e.message, 'bad');
  }finally{
    driveBusy = false; setDriveBusy(false); updateDriveStatus();
  }
}
async function drivePull(){
  if(driveBusy) return;
  driveBusy = true; setDriveBusy(true);
  try{
    await driveGetToken();
    const file = await driveFindFile();
    if(!file){ showToast("Aucun fichier de synchro sur Drive : envoie d'abord depuis l'autre appareil", 'warn'); return; }
    const text = await (await driveApi(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`)).text();
    let data;
    try{ data = parseBackupFileContent(text); }catch(e){ throw new Error('fichier Drive illisible'); }
    if(!data || !data.exercises || !Array.isArray(data.users)) throw new Error("le fichier Drive n'est pas une sauvegarde complète FONTE");
    const count = list => list.reduce((s,u)=> s + (Array.isArray(u.sessions) ? u.sessions.length : 0), 0);
    const local = [];
    for(const u of loadUsers()) local.push({ sessions: (u.id === currentUserId()) ? state.sessions : await readSessionsForUser(u.id) });
    const nDrive = count(data.users), nLocal = count(local);
    let warn = '';
    if(nLocal > nDrive) warn += ' ATTENTION : cet appareil contient plus de séances que Drive.';
    if(!loadDriveMeta().syncedAt) warn += " Cet appareil n'a jamais été synchronisé : envoie ou sauvegarde avant si tu as des séances récentes ici.";
    if(!confirm(`Drive : ${nDrive} séances (fichier du ${driveDateFr(file.modifiedTime)}). Cet appareil : ${nLocal} séances. Remplacer les données de cet appareil par celles de Drive ?${warn}`)) return;
    await applyGlobalBackupData(data);
    saveDriveMeta({fileId:file.id, remoteModified:file.modifiedTime, syncedAt:new Date().toISOString()});
    showToast('Données récupérées depuis Drive', 'good');
  }catch(e){
    showToast('Récupération Drive impossible : ' + e.message, 'bad');
  }finally{
    driveBusy = false; setDriveBusy(false); updateDriveStatus();
  }
}

function handleRestoreExercisesFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ showToast('Fichier invalide', 'bad'); return; }
    const incoming = Array.isArray(data) ? data : data.exercises;
    if(!Array.isArray(incoming)){ showToast("Ce fichier ne ressemble pas à une sauvegarde d'exercices FONTE", 'bad'); return; }
    let added=0, updated=0;
    incoming.forEach(inc=>{
      if(!inc || !inc.name) return;
      const id = inc.id || slugify(inc.name);
      const clean = {
        id, name: inc.name,
        muscles: Array.isArray(inc.muscles) ? inc.muscles : [],
        classified: !!inc.classified,
        variants: Array.isArray(inc.variants) ? inc.variants : [],
        defaultVariant: inc.defaultVariant || '',
        isCable: !!inc.isCable
      };
      const existing = state.exercises.find(e=>e.id===id);
      if(existing){ Object.assign(existing, clean); updated++; }
      else { state.exercises.push(clean); added++; }
    });
    await saveExercises();
    showToast(`Exercices fusionnés : ${added} ajouté(s), ${updated} mis à jour`, 'good');
    renderNav();
    renderBackupView();
  };
  reader.readAsText(f);
}
async function readSessionsForUser(userId){
  const sessions = await readStored('sessions', userId);
  return Array.isArray(sessions) ? sessions : [];
}
async function writeSessionsForUser(userId, sessions){
  await writeStored('sessions', sessions, userId);
}
async function buildGlobalBackupPayload(){
  // Sauvegarde complète de l'application : exercices partagés + séances de tous les profils + leurs noms.
  const usersData = [];
  for(const u of loadUsers()){
    const sessions = (u.id === currentUserId()) ? state.sessions : await readSessionsForUser(u.id);
    usersData.push({ id:u.id, name:u.name, color:u.color, sessions });
  }
  return { version:3, type:'fonte-global-backup', exportedAt: new Date().toISOString(), exercises: state.exercises, pulleyTypes: PULLEYS, users: usersData };
}
async function exportGlobalBackup(){
  const payload = await buildGlobalBackupPayload();
  const users = payload.users;
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fonte-backup-complet-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(`Sauvegarde complète (${users.length} profil${users.length>1?'s':''}) téléchargée`, 'good');
}
async function exportGlobalBackupCompressed(){
  const payload = await buildGlobalBackupPayload();
  const raw = JSON.stringify(payload);
  let content, ext;
  if(window.LZString){
    content = 'FONTEC1' + LZString.compressToBase64(raw);
    ext = 'fonte';
  } else {
    content = raw;
    ext = 'json';
    showToast('Compression indisponible, export en JSON classique', 'warn');
  }
  const blob = new Blob([content], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fonte-backup-complet-${todayISO()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Sauvegarde complète compressée téléchargée', 'good');
}
function handleRestoreGlobalFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = parseBackupFileContent(reader.result); }
    catch(err){ showToast('Fichier invalide', 'bad'); return; }
    const incomingUsers = Array.isArray(data.users) ? data.users : null;
    if(!data.exercises || !incomingUsers){ showToast("Ce fichier ne ressemble pas à une sauvegarde complète FONTE (2 profils)", 'bad'); return; }
    const totalIncomingSessions = incomingUsers.reduce((sum,u)=> sum + (Array.isArray(u.sessions)?u.sessions.length:0), 0);
    const totalCurrentSessions = state.sessions.length; // au minimum, on affiche le profil actif ; le vrai total tous profils est calculé ci-dessous si besoin
    if(!confirm(`Restaurer cette sauvegarde COMPLÈTE remplacera la base d'exercices partagée ET les séances des ${incomingUsers.length} profil(s) du fichier (${totalIncomingSessions} séances au total). Cela écrase les données actuelles des deux profils sur cet appareil. Continuer ?`)) return;

    await applyGlobalBackupData(data);
    showToast('Sauvegarde complète restaurée', 'good');
  };
  reader.readAsText(f);
}
async function applyGlobalBackupData(data){
  const incomingUsers = data.users;
  // Exercices (partagés)
  data.exercises.forEach(ex=>{ ex.variants = Array.isArray(ex.variants) ? ex.variants : []; });
  state.exercises = data.exercises;
  await saveExercises();

  // Types de poulie : fusionnés avec les types par défaut pour ne jamais perdre 'normal'/'nouvelles'/'matrix'
  // même si le fichier de sauvegarde est ancien (sans pulleyTypes) ou incomplet.
  if(data.pulleyTypes && typeof data.pulleyTypes === 'object'){
    PULLEYS = {...DEFAULT_PULLEYS, ...data.pulleyTypes};
    await savePulleyTypes();
  }

  // Profils : on garde les identifiants du fichier tels quels pour rester cohérent avec ses données.
  // La couleur est reprise si présente dans le fichier (sauvegardes récentes) ; sinon (anciennes
  // sauvegardes sans couleur), on en attribue une automatiquement pour ne pas se retrouver sans accent.
  const newUsers = [];
  incomingUsers.forEach(u=>{
    newUsers.push({ id: u.id, name: u.name || 'Utilisateur', color: u.color || nextSuggestedUserColor(newUsers) });
  });
  saveUsers(newUsers.length ? newUsers : DEFAULT_USERS.slice());

  // Séances de chaque profil, écrites directement dans le namespace correspondant.
  for(const u of incomingUsers){
    const sessions = Array.isArray(u.sessions) ? u.sessions : [];
    await writeSessionsForUser(u.id, sessions);
  }

  // Recharge l'état courant : si le profil actif n'existe plus dans la sauvegarde, on bascule sur le premier.
  const stillExists = newUsers.some(u=>u.id === currentUserId());
  state.currentUserId = stillExists ? currentUserId() : (newUsers[0] ? newUsers[0].id : DEFAULT_USER_ID);
  setActiveUserId(state.currentUserId);
  state.sessions = await readStored('sessions') || [];
  migratePulleyData();

  applyUserTheme();
  renderUserSwitcher();
  renderNav();
  renderBackupView();
}
function exportBackup(){
  const payload = { version:2, exportedAt: new Date().toISOString(), exercises: state.exercises, pulleyTypes: PULLEYS, sessions: state.sessions };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fonte-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Sauvegarde téléchargée', 'good');
}
function getLocalStorageUsage(){
  // Approximation en octets : chaque caractère UTF-16 en localStorage compte pour 2 octets.
  let appBytes = 0, totalBytes = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      const bytes = (k.length + v.length) * 2;
      totalBytes += bytes;
      if(k && k.indexOf(STORAGE_PREFIX) === 0) appBytes += bytes;
    }
  }catch(e){}
  return { appBytes, totalBytes };
}
function exportBackupCompressed(){
  // Sauvegarde compressée : même contenu que exportBackup(), mais encodé avec LZString pour
  // produire un fichier plus léger. Extension .fonte pour la distinguer d'un JSON classique.
  const payload = { version:2, exportedAt: new Date().toISOString(), exercises: state.exercises, pulleyTypes: PULLEYS, sessions: state.sessions };
  const raw = JSON.stringify(payload);
  let content, ext;
  if(window.LZString){
    content = 'FONTEC1' + LZString.compressToBase64(raw);
    ext = 'fonte';
  } else {
    content = raw;
    ext = 'json';
    showToast('Compression indisponible, export en JSON classique', 'warn');
  }
  const blob = new Blob([content], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fonte-backup-${todayISO()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Sauvegarde compressée téléchargée', 'good');
}
function parseBackupFileContent(text){
  // Accepte à la fois un JSON classique et une sauvegarde compressée (.fonte, préfixe FONTEC1).
  if(typeof text === 'string' && text.startsWith('FONTEC1')){
    if(!window.LZString) throw new Error('Décompression indisponible dans ce navigateur');
    const raw = LZString.decompressFromBase64(text.slice('FONTEC1'.length));
    if(raw === null || raw === undefined) throw new Error('Fichier compressé invalide');
    return JSON.parse(raw);
  }
  return JSON.parse(text);
}
function handleRestoreFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = parseBackupFileContent(reader.result); }
    catch(err){ showToast('Fichier invalide', 'bad'); return; }
    if(!data.exercises || !data.sessions){ showToast('Ce fichier ne ressemble pas à une sauvegarde FONTE', 'bad'); return; }

    state.exercises = data.exercises;
    state.sessions = data.sessions;
    state.exercises.forEach(e=>{ e.variants=Array.isArray(e.variants)?e.variants:[]; });
    // Types de poulie : fusionnés avec les types par défaut pour ne jamais perdre 'normal'/'nouvelles'/'matrix'
    // même si le fichier de sauvegarde est ancien (sans pulleyTypes) ou incomplet.
    if(data.pulleyTypes && typeof data.pulleyTypes === 'object'){
      PULLEYS = {...DEFAULT_PULLEYS, ...data.pulleyTypes};
      await savePulleyTypes();
    }
    migratePulleyData();
    await saveExercises();

  };
  reader.readAsText(f);
}

/* ============================= COMPARAISON DES PROFILS ============================= */
/* Vue "Comparer les profils" : affiche côte à côte une copie fidèle des indicateurs et graphiques
   du tableau de bord pour chacun des profils, avec mise en évidence de la valeur la plus haute sur
   chaque ligne comparée. Réutilise volontairement les mêmes fonctions de calcul pures que le tableau
   de bord (computeKPIs, getMuscleVolumeDistribution, etc.) en basculant temporairement state.sessions
   / state.dashTypeFilter sur le profil et le filtre voulus, puis en restaurant l'état courant. */
// Couleurs fixes par colonne (A/B) réutilisées à la fois pour la mise en évidence des écarts et pour
// distinguer les deux utilisateurs sur les graphiques en barre partagés.
const COMPARE_COLORS = { a:USER_COLOR_POOL[0], b:USER_COLOR_POOL[1] };
function compareActiveRange(){ return periodRange('cmp'); }
function compareTypeFilterLabel(){
  return DASH_TYPE_LABELS[state.compareTypeFilter] ?? 'Toutes les séances';
}
/* Calcule un instantané complet des stats d'un profil (séances déjà chargées) pour la période et le
   filtre de type donnés, sans jamais modifier l'état affiché par ailleurs (restauré dans le finally). */
function computeUserSnapshot(sessions, range, typeFilter){
  const prevSessions = state.sessions, prevType = state.dashTypeFilter;
  state.sessions = sessions; state.dashTypeFilter = typeFilter;
  try{
    const kpi = computeKPIs(range);
    const dur = computeDurationStats(range);
    const kcal = computeKcalStats(range);
    const newPr = countRecentPRs(range);
    const muscleTotals = getMuscleVolumeDistribution(range);
    const typeTotals = computeSessionTypeVolumeDistribution(range);
    const volumeTrend = computeVolumeTrend(range);
    const durationTrend = computeDurationTrend(range);
    const kcalTrend = computeKcalTrend(range);
    const weekday = computeWeekdayFrequency(range);

    // série en cours : comme sur le tableau de bord, calculée sur TOUT l'historique du profil,
    // indépendamment de la période et du filtre de type sélectionnés dans la vue de comparaison.
    const dateSet = new Set(sessions.map(s=>s.date));
    let streak = 0;
    let cursor = new Date();
    if(!dateSet.has(todayISO())) cursor.setDate(cursor.getDate()-1);
    while(true){
      const iso = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
      if(dateSet.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
    }

    return {
      totalSessions: sessions.length,
      streak, kpi, dur, kcal, newPr,
      muscleEntries: MUSCLE_GROUPS.map(m=>({...m, val: muscleTotals[m.id]||0})).filter(m=>m.val>0.01),
      typeEntries: [['push','Push'],['pull','Pull'],['upper','Upper'],['legs','Legs'],['other','Autre']]
        .map(([k,label])=>({label, val: typeTotals[k]||0, color: SESSION_TYPES[k].color})).filter(e=>e.val>0.01),
      volumeTrend, durationTrend, kcalTrend, weekday
    };
  } finally {
    state.sessions = prevSessions; state.dashTypeFilter = prevType;
  }
}
function fmtInt(v){ return String(Math.round(v)); }
function fmtKg(v){ return Math.round(v).toLocaleString('fr-FR')+' kg'; }
function fmtKcalCmp(v){ return Math.round(v).toLocaleString('fr-FR')+' kcal'; }
function fmtDurCmp(v){ return v ? formatDuration(Math.round(v)) : '—'; }

/* En-tête "VS" : avatar + nom des deux profils affichés en miroir de part et d'autre d'un badge

/* Une ligne de comparaison "appariée" : les deux valeurs sont côte à côte sur la même ligne, la plus
   haute est mise en évidence en vert, et l'écart est indiqué au centre par une flèche pointant vers
   le profil en tête (fini le fait de devoir comparer deux blocs éloignés l'un de l'autre). */
function cmpVsRow(sub, valueA, valueB, fmt){
  const strA = fmt(valueA), strB = fmt(valueB);
  // Ex æquo : on compare les valeurs telles qu'affichées (arrondies/formatées), pas les valeurs brutes.
  // Sans ça, deux stats qui s'affichent à l'identique (ex: 1200 kg vs 1200 kg après arrondi) pouvaient
  // quand même montrer une flèche avec un écart de "0 kg" à cause d'une minuscule différence interne.
  const tie = strA === strB;
  const diff = valueA - valueB;
  const aHi = !tie && diff>0, bHi = !tie && diff<0;
  const midHtml = tie
    ? `<span class="cmp-vs-eq">=</span>`
    : `<span class="cmp-vs-arrow">${aHi?'◀':'▶'}</span><span>${fmt(Math.abs(diff))}</span>`;
  return `<div class="cmp-vs-row">
    <div class="cmp-vs-sub">${sub}</div>
    <div class="cmp-vs-values">
      <div class="cmp-vs-val${aHi?' cmp-hi':''}${tie?' cmp-tie':''}">${strA}</div>
      <div class="cmp-vs-mid">${midHtml}</div>
      <div class="cmp-vs-val${bHi?' cmp-hi':''}${tie?' cmp-tie':''}">${strB}</div>
    </div>
  </div>`;
}
function cmpVsGroup(label, rowsHtml){
  return `<div class="stat-group">
    <div class="stat-group-label">${label}</div>
    ${rowsHtml}
  </div>`;
}
/* Reproduit les 5 mêmes groupes (Séances / Volume / Temps / Calories / Forme) que le tableau de bord,

    ${cmpVsGroup('Forme',

/* Module "Progression par exercice" de la vue comparaison : reprend le graphique du tableau de bord
   mais réunit les deux profils sur UN SEUL graphique, chacun avec ses courbes (charge max en trait plein,
   1RM estimée en pointillés) dans sa propre couleur (COMPARE_COLORS.a / .b), pour comparer leur progression
   sur un même exercice d'un coup d'œil — au lieu de deux graphiques séparés à comparer côte à côte. */
function buildCompareProgressionHtml(){

    <div class="card" style="margin-top:16px;">
      <div class="card-head">

/* Fusionne les historiques d'exercice de deux profils (produits par getExerciseHistoryForSessions) sur
   l'union de leurs dates de séance, pour obtenir un seul jeu de labels communs avec, pour chacun, la
   charge max et la 1RM estimée du profil A et celles du profil B (null quand une des deux n'a pas de
   donnée ce jour-là, pour que Chart.js n'y trace pas un point à zéro). */
function mergeExerciseHistorySeries(histA, histB){
  const map = {};
  histA.forEach(h=>{ if(!map[h.date]) map[h.date] = {date:h.date}; map[h.date].aCharge = h.maxWeight; map[h.date].aRm = h.best1rm; map[h.date].aVolume = h.volume; });
  histB.forEach(h=>{ if(!map[h.date]) map[h.date] = {date:h.date}; map[h.date].bCharge = h.maxWeight; map[h.date].bRm = h.best1rm; map[h.date].bVolume = h.volume; });
  return Object.values(map).sort((x,y)=>x.date.localeCompare(y.date));
}

  }).join('');
}
function renderCompareProgressionChart(uA, uB, sessA, sessB, range){
  const exSel = document.getElementById('cmp-progression-exercise-select');
  const varSel = document.getElementById('cmp-progression-variant-select');
  const pulleySel = document.getElementById('cmp-progression-pulley-select');
  const legendEl = document.getElementById('cmp-progression-legend');
  const wrap = document.getElementById('cmp-progression-chart-wrap');
  if(!exSel || !wrap) return;

  const sorted = state.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name));
  exSel.innerHTML = sorted.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
  if(!state.compareExerciseId || !state.exercises.find(e=>e.id===state.compareExerciseId)){
    state.compareExerciseId = sorted.length ? sorted[0].id : null;
  }
  exSel.value = state.compareExerciseId || '';
  bindExercisePickerButton(exSel);
  exSel.onchange = ()=>{ state.compareExerciseId = exSel.value; state.compareVariant='__auto__'; state.comparePulley='__all__'; renderCompareProgressionChart(uA, uB, sessA, sessB, range); };
  varSel.onchange = ()=>{ state.compareVariant = varSel.value; renderCompareProgressionChart(uA, uB, sessA, sessB, range); };
  pulleySel.onchange = ()=>{ state.comparePulley = pulleySel.value; renderCompareProgressionChart(uA, uB, sessA, sessB, range); };

  const ex = state.exercises.find(e=>e.id===state.compareExerciseId);
  if(!ex){
    varSel.innerHTML = ''; pulleySel.innerHTML='';
    const hEl = document.getElementById('cmp-progression-history'); if(hEl) hEl.innerHTML='';
    if(legendEl) legendEl.innerHTML='';
    wrap.innerHTML = emptyState('SHIELD','Aucun exercice','Crée un exercice pour voir apparaître sa progression.');
    return;
  }
  const allSess = sessA.concat(sessB), vm = variantMenu(ex, allSess, state.compareVariant);
  varSel.innerHTML = vm.html; varSel.value = state.compareVariant = vm.value;
  if(ex.isCable){
    const pm = pulleyMenu(ex, allSess, state.compareVariant, state.comparePulley);
    pulleySel.innerHTML = pm.html; pulleySel.value = state.comparePulley = pm.value;
    pulleySel.style.display='';
  } else {
    pulleySel.innerHTML = '<option value="__all__">Sans poulie</option>';
    pulleySel.value = '__all__';
    pulleySel.style.display = 'none';
    state.comparePulley = '__all__';
  }

  const histA = getExerciseHistoryForSessions(sessA, ex.id, state.compareVariant, state.comparePulley, range, state.compareTypeFilter);
  const histB = getExerciseHistoryForSessions(sessB, ex.id, state.compareVariant, state.comparePulley, range, state.compareTypeFilter);

  if(legendEl){
    legendEl.innerHTML = `<div class="cmp-legend" style="margin-bottom:8px;">
      <span class="cmp-legend-item"><span class="dot" style="background:${COMPARE_COLORS.a};"></span>${escapeHtml(uA.name)}</span>
      <span class="cmp-legend-item"><span class="dot" style="background:${COMPARE_COLORS.b};"></span>${escapeHtml(uB.name)}</span>
    </div>`;
  }

  renderCompareHistory(ex, uA, uB, sessA, sessB);
  if(histA.length===0 && histB.length===0){
    wrap.innerHTML = emptyState('M4 19V10M10 19V5M16 19V13M22 19H2','Rien à afficher',"Cet exercice n'apparaît dans aucune séance des deux profils sur la période sélectionnée.");
    return;
  }
  if(!document.getElementById('cmp-chart-progression')){
    wrap.innerHTML = '<canvas id="cmp-chart-progression"></canvas>';
  }

  const merged = mergeExerciseHistorySeries(histA, histB);
  const labels = merged.map(m=>fmtDateShort(m.date));
  const round1OrNull = v => (v===undefined || v===null) ? null : round1(v);

  // Même logique que le graphique du tableau de bord : la courbe ne part pas de zéro, l'échelle est
  // resserrée autour des valeurs réellement atteintes (charge max + 1RM des deux profils confondus).
  const aChargeData = merged.map(m=>round1OrNull(m.aCharge));
  const aRmData = merged.map(m=>round1OrNull(m.aRm));
  const bChargeData = merged.map(m=>round1OrNull(m.bCharge));
  const bRmData = merged.map(m=>round1OrNull(m.bRm));
  const aVolumeData = merged.map(m=>round1OrNull(m.aVolume));
  const bVolumeData = merged.map(m=>round1OrNull(m.bVolume));
  const allVals = aChargeData.concat(aRmData, bChargeData, bRmData).filter(v=>v!==null && v>0);
  const dataMin = allVals.length ? Math.min(...allVals) : 0;
  const dataMax = allVals.length ? Math.max(...allVals) : 0;
  const pad = Math.max((dataMax-dataMin)*0.15, dataMax*0.08, 2.5);
  const yMin = Math.max(0, Math.floor(dataMin-pad));
  const yMax = Math.ceil(dataMax+pad);
  const volMax = Math.max(0, ...aVolumeData.filter(v=>v!==null), ...bVolumeData.filter(v=>v!==null));

  renderChartSafe('cmp-chart-progression', {

        {

          label:`${uA.name} — Volume (kg)`,

        {

          borderColor: COMPARE_COLORS.a,
          backgroundColor:'transparent',
          borderWidth:1.5,
          borderDash:[5,4],
          tension:0,
          spanGaps:true,
          pointRadius:2,
          pointHoverRadius:5,
          pointHitRadius:14,
          pointBackgroundColor: COMPARE_COLORS.a,
          pointBorderColor:COLORS.surface,
          pointBorderWidth:1,
          order:1,
          yAxisID:'y'
        },
        {
          label:`${uB.name} — Charge max (kg)`,
          data: bChargeData,
          borderColor: COMPARE_COLORS.b,
          backgroundColor: 'transparent',
          borderWidth:2.5,
          tension:0,
          spanGaps:true,
          pointRadius:3,
          pointHoverRadius:6,
          pointHitRadius:14,
          pointBackgroundColor: COMPARE_COLORS.b,
          pointBorderColor:COLORS.surface,
          pointBorderWidth:1.5,
          order:1,
          yAxisID:'y'
        },
        {
          label:`${uB.name} — 1RM estimée (kg)`,

          borderColor: COMPARE_COLORS.b,
          backgroundColor:'transparent',
          borderWidth:1.5,
          borderDash:[5,4],
          tension:0,

      plugins:{
        legend:{ labels:{color:COLORS.muted, font:{size:11}, usePointStyle:true, boxWidth:8, padding:14} },
        tooltip:{ callbacks:{ label: (ctx)=> ctx.parsed.y===null ? null : (ctx.dataset.yAxisID==='y1'
          ? `${ctx.dataset.label}: ${Number(ctx.raw).toLocaleString('fr-FR')} kg`
          : `${ctx.dataset.label}: ${ctx.formattedValue} kg`) } }

      scales:{
        x: Object.assign(chartGridOpts(), {ticks:Object.assign({}, chartGridOpts().ticks, {maxRotation:0, autoSkip:true, autoSkipPadding:12})}),

}
/* Graphiques en doughnut : un seul jeu de cartes, chacune contenant les deux mini-graphiques
   (un par profil) côte à côte, avec le nom du profil au-dessus — au lieu de deux cartes pleine
   largeur identiques, dupliquées une sous l'autre dans deux colonnes séparées. */
function buildCompareChartsHtml(uA, uB){
  return `
    <div class="card cmp-chart-card">
      <div class="section-title">Répartition du volume par muscle</div>
      <div class="cmp-dual-chart">
        <div class="cmp-dual-chart-half">
          <div class="cmp-dual-chart-name" style="color:${COMPARE_COLORS.a};">${escapeHtml(uA.name)}</div>
          <div style="height:190px;" id="cmp-muscle-wrap-a"><canvas id="cmp-muscle-a"></canvas></div>
        </div>
        <div class="cmp-dual-chart-half">
          <div class="cmp-dual-chart-name" style="color:${COMPARE_COLORS.b};">${escapeHtml(uB.name)}</div>
          <div style="height:190px;" id="cmp-muscle-wrap-b"><canvas id="cmp-muscle-b"></canvas></div>
        </div>
      </div>
    </div>
    <div class="card cmp-chart-card">
      <div class="section-title">Répartition par type de séance</div>
      <div class="cmp-dual-chart">
        <div class="cmp-dual-chart-half">
          <div class="cmp-dual-chart-name" style="color:${COMPARE_COLORS.a};">${escapeHtml(uA.name)}</div>
          <div style="height:170px;" id="cmp-type-wrap-a"><canvas id="cmp-type-a"></canvas></div>
        </div>
        <div class="cmp-dual-chart-half">
          <div class="cmp-dual-chart-name" style="color:${COMPARE_COLORS.b};">${escapeHtml(uB.name)}</div>
          <div style="height:170px;" id="cmp-type-wrap-b"><canvas id="cmp-type-b"></canvas></div>
        </div>
      </div>

}
function renderCompareDoughnuts(suffix, snap){
  const muscleWrap = document.getElementById('cmp-muscle-wrap-'+suffix);
  if(muscleWrap){
    if(snap.muscleEntries.length===0){
      muscleWrap.innerHTML = emptyState('M4 12h16M4 8v8M20 8v8M2 10v4M22 10v4','Rien à afficher','Aucune séance sur cette période.');
    } else {
      if(!document.getElementById('cmp-muscle-'+suffix)) muscleWrap.innerHTML = `<canvas id="cmp-muscle-${suffix}"></canvas>`;
      renderChartSafe('cmp-muscle-'+suffix, {
        type:'doughnut',
        data:{ labels: snap.muscleEntries.map(e=>e.label), datasets:[{ data: snap.muscleEntries.map(e=>Math.round(e.val)), backgroundColor: snap.muscleEntries.map(e=>e.color), borderColor:COLORS.surface, borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color:COLORS.muted, boxWidth:8, font:{size:9.5}, padding:8 } } } }
      });
    }
  }
  const typeWrap = document.getElementById('cmp-type-wrap-'+suffix);
  if(typeWrap){
    if(snap.typeEntries.length===0){
      typeWrap.innerHTML = emptyState('CAL','Rien à afficher','Aucune séance sur cette période.');
    } else {
      if(!document.getElementById('cmp-type-'+suffix)) typeWrap.innerHTML = `<canvas id="cmp-type-${suffix}"></canvas>`;
      renderChartSafe('cmp-type-'+suffix, {
        type:'doughnut',
        data:{ labels: snap.typeEntries.map(e=>e.label), datasets:[{ data: snap.typeEntries.map(e=>Math.round(e.val)), backgroundColor: snap.typeEntries.map(e=>e.color), borderColor:COLORS.surface, borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color:COLORS.muted, boxWidth:8, font:{size:9.5}, padding:8 } } } }
      });
    }
  }
}
/* Fusionne deux séries de buckets temporels (une par utilisateur, chacune produite par
   computeVolumeTrend/computeDurationTrend/computeKcalTrend) sur l'union de leurs clés, pour obtenir
   un seul jeu de catégories communes avec, pour chacune, la valeur du profil A et celle du profil B. */
function mergeTrendSeries(entriesA, entriesB, valueKey){
  const map = {};
  entriesA.forEach(e=>{ if(!map[e.key]) map[e.key] = {key:e.key, label:e.label, a:0, b:0}; map[e.key].a = e[valueKey]; });
  entriesB.forEach(e=>{ if(!map[e.key]) map[e.key] = {key:e.key, label:e.label, a:0, b:0}; map[e.key].b = e[valueKey]; });
  return Object.values(map).sort((x,y)=>x.key.localeCompare(y.key));
}
function twoUserLegendHtml(uA, uB){
  return `<div class="cmp-legend">
    <span class="cmp-legend-item"><span class="dot" style="background:${COMPARE_COLORS.a};"></span>${escapeHtml(uA.name)}</span>
    <span class="cmp-legend-item"><span class="dot" style="background:${COMPARE_COLORS.b};"></span>${escapeHtml(uB.name)}</span>
  </div>`;
}
/* Les 4 widgets "en barre" du tableau de bord (volume / durée / calories dans le temps + fréquence par
   jour), fusionnés en un seul graphique par widget, chaque utilisateur ayant sa propre couleur de barre. */
function buildCompareBarWidgetsHtml(){
  return `
    <div class="section-title" style="margin:22px 0 12px;">Comparaison dans le temps</div>
    <div class="grid-2-even" style="margin-top:0;">
      <div class="card">
        <div class="section-title">Volume dans le temps</div>
        <div class="cmp-bar-wrap" id="cmp-bar-wrap-volume"><div class="cmp-bar-chart-holder"><canvas id="cmp-bar-volume"></canvas></div></div>
      </div>
      <div class="card">
        <div class="section-title">Durée des séances dans le temps</div>
        <div class="cmp-bar-wrap" id="cmp-bar-wrap-duration"><div class="cmp-bar-chart-holder"><canvas id="cmp-bar-duration"></canvas></div></div>
      </div>
    </div>
    <div class="grid-2-even">
      <div class="card">
        <div class="section-title">Calories dans le temps</div>
        <div class="cmp-bar-wrap" id="cmp-bar-wrap-kcal"><div class="cmp-bar-chart-holder"><canvas id="cmp-bar-kcal"></canvas></div></div>
      </div>
      <div class="card">
        <div class="section-title">Fréquence par jour de la semaine</div>
        <div class="cmp-bar-wrap" id="cmp-bar-wrap-weekday"><div class="cmp-bar-chart-holder"><canvas id="cmp-bar-weekday"></canvas></div></div>
      </div>
    </div>`;
}
function renderCompareBarWidgets(uA, uB, snapA, snapB){
  const legend = twoUserLegendHtml(uA, uB);
  function twoUserBar(key, wrapId, canvasId, mergedRows, tooltipFmt, emptyIcon, emptyMsg){
    const wrap = document.getElementById(wrapId);
    if(!wrap) return;
    if(mergedRows.length===0){
      wrap.innerHTML = legend + `<div class="cmp-bar-chart-holder">${emptyState(emptyIcon, 'Rien à afficher', emptyMsg)}</div>`;
      return;
    }
    if(!document.getElementById(canvasId)) wrap.innerHTML = legend + `<div class="cmp-bar-chart-holder"><canvas id="${canvasId}"></canvas></div>`;
    else if(!wrap.querySelector('.cmp-legend')) wrap.insertAdjacentHTML('afterbegin', legend);
    renderChartSafe(canvasId, {
      type:'bar',
      data:{ labels: mergedRows.map(r=>r.label), datasets:[
        { label: uA.name, data: mergedRows.map(r=>Math.round(r.a)), backgroundColor: COMPARE_COLORS.a, borderRadius:4, maxBarThickness:20 },
        { label: uB.name, data: mergedRows.map(r=>Math.round(r.b)), backgroundColor: COMPARE_COLORS.b, borderRadius:4, maxBarThickness:20 }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip: tooltipFmt ? { callbacks:{ label: tooltipFmt } } : undefined },
        scales:{ x:chartGridOpts(), y:chartGridOpts() }
      }
    });
  }

  const volumeRows = mergeTrendSeries(snapA.volumeTrend, snapB.volumeTrend, 'volume');
  twoUserBar('volume', 'cmp-bar-wrap-volume', 'cmp-bar-volume', volumeRows, null,
    'M4 19V10M10 19V5M16 19V13M22 19H2', 'Aucune séance sur cette période.');

  const durationRows = mergeTrendSeries(snapA.durationTrend, snapB.durationTrend, 'minutes');
  twoUserBar('duration', 'cmp-bar-wrap-duration', 'cmp-bar-duration', durationRows,
    (ctx)=> `${ctx.dataset.label} : ${formatDuration(ctx.parsed.y)}`,
    'M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z', 'Aucune durée renseignée sur cette période.');

  const kcalRows = mergeTrendSeries(snapA.kcalTrend, snapB.kcalTrend, 'kcal');
  twoUserBar('kcal', 'cmp-bar-wrap-kcal', 'cmp-bar-kcal', kcalRows,
    (ctx)=> `${ctx.dataset.label} : ${ctx.parsed.y.toLocaleString('fr-FR')} kcal`,
    'M13 2L3 14h9l-1 8 10-12h-9l1-8z', 'Aucune calorie renseignée sur cette période.');

  const weekdayRows = DAYS_FR.map((label,i)=>({ key:String(i), label, a: snapA.weekday[i]||0, b: snapB.weekday[i]||0 }));
  twoUserBar('weekday', 'cmp-bar-wrap-weekday', 'cmp-bar-weekday', weekdayRows.some(r=>r.a||r.b) ? weekdayRows : [],
    null, 'CAL', 'Aucune séance sur cette période.');
}
async function renderCompareBody(){
  const body = document.getElementById('cmp-body');
  if(!body) return;
  const users = loadUsers();
  if(users.length<2){
    body.innerHTML = `<div class="card">${emptyState('SHIELD','Deux profils sont nécessaires','Crée un second profil pour pouvoir comparer.')}<div style="text-align:center;margin-top:14px;"><button type="button" class="btn primary" id="cmp-create-profile">Créer un profil</button></div></div>`;
    const cb = document.getElementById('cmp-create-profile');
    if(cb) cb.addEventListener('click', ()=>{ switchView('profiles'); const add = document.getElementById('add-user-btn'); if(add){ add.click(); } });
    return;
  }
  // S'il y a plus de 2 profils, on garde en mémoire lesquels sont sélectionnés pour la comparaison
  // (par défaut : les 2 premiers), avec des sélecteurs pour changer de paire depuis renderCompareView().
  let idA = state.compareUserAId, idB = state.compareUserBId;
  if(!idA || !users.some(u=>u.id===idA)) idA = users[0].id;
  if(!idB || !users.some(u=>u.id===idB) || idB===idA) idB = (users.find(u=>u.id!==idA) || users[1]).id;
  state.compareUserAId = idA;
  state.compareUserBId = idB;
  const uA = users.find(u=>u.id===idA), uB = users.find(u=>u.id===idB);
  COMPARE_COLORS.a = readableColor(uA.color || USER_COLOR_POOL[0]);
  COMPARE_COLORS.b = readableColor(uB.color || USER_COLOR_POOL[1]);
  // Puces « Profil A / Profil B » : seulement s'il y a plus de 2 profils (sinon la paire est évidente).
  const abChips = document.getElementById('cmp-ab-chips');
  if(abChips){
    abChips.style.display = users.length>2 ? 'flex' : 'none';
    if(users.length>2){
      [['a',idA,uA],['b',idB,uB]].forEach(([side,cur,u])=>{
        const lab = document.getElementById(`cmp-${side}-label`);
        if(lab) lab.textContent = u.name;
        const panel = document.getElementById(`cmp-${side}-panel`);
        if(!panel) return;
        panel.innerHTML = `<div class="seg-group">${users.map(x=>`<button type="button" class="seg-btn${x.id===cur?' active':''}" data-cmp-user="${side}|${x.id}">${escapeHtml(x.name)}</button>`).join('')}</div>`;
        panel.querySelectorAll('[data-cmp-user]').forEach(btn=> btn.addEventListener('click', ()=>{
          const [sd, id] = btn.dataset.cmpUser.split('|');
          if(sd==='a') state.compareUserAId = id; else state.compareUserBId = id;
          renderCompareBody();
        }));
      });
    }
  }
  const range = compareActiveRange();
  const [sessA, sessB] = await Promise.all([
    uA.id===currentUserId() ? Promise.resolve(state.sessions) : readSessionsForUser(uA.id),
    uB.id===currentUserId() ? Promise.resolve(state.sessions) : readSessionsForUser(uB.id),
  ]);
  const snapA = computeUserSnapshot(sessA, range, state.compareTypeFilter);
  const snapB = computeUserSnapshot(sessB, range, state.compareTypeFilter);

  syncPeriodPanel('cmp', 'cmp');
  const typeLabel = document.getElementById('cmp-type-label');
  if(typeLabel) typeLabel.textContent = compareTypeFilterLabel();

  body.innerHTML = `
    ${buildCompareVsHeadHtml(uA, uB, snapA, snapB)}
    ${buildUnifiedStatGroupsHtml(snapA, snapB)}
    ${buildCompareProgressionHtml()}
    ${buildCompareChartsHtml(uA, uB)}
    ${buildCompareBarWidgetsHtml()}`;
  renderCompareProgressionChart(uA, uB, sessA, sessB, range);
  renderCompareDoughnuts('a', snapA);
  renderCompareDoughnuts('b', snapB);
  renderCompareBarWidgets(uA, uB, snapA, snapB);
}
function renderCompareView(){
  const el = document.getElementById('view-compare');
  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Comparer les profils</h1>
        <div class="page-sub">Le tableau de bord des deux profils, côte à côte — les écarts sont mis en évidence</div>
      </div>
    </div>
    <div class="filter-bar">
      <div id="cmp-ab-chips" style="display:none;gap:8px;flex-wrap:wrap;">
        ${filterChipHtml('cmp-a-panel','Profil A','cmp-a-label','','')}
        ${filterChipHtml('cmp-b-panel','Profil B','cmp-b-label','','')}
      </div>
      ${filterChipHtml('cmp-period-panel','Période','cmp-period-label',periodLabel('cmp'),periodPanelHtml('cmp'))}
      ${filterChipHtml('cmp-type-panel','Type','cmp-type-label','',`
        <div class="seg-group" id="cmp-type-group">
          ${[['__all__','Tout'],['push','Push'],['pull','Pull'],['upper','Upper'],['legs','Legs'],['other','Autres']].map(([v,l])=>`<button class="seg-btn${state.compareTypeFilter===v?' active':''}" data-ct="${v}">${l}</button>`).join('')}
        </div>`)}
    </div>
    <div id="cmp-body"><div class="card">${emptyState('COMPARE','Chargement…','Calcul de la comparaison en cours.')}</div></div>
  `;
  bindFilterChips(el);
  bindPeriodPanel('cmp', 'cmp', renderCompareBody);
  el.querySelectorAll('#cmp-type-group [data-ct]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.compareTypeFilter = b.dataset.ct;
      el.querySelectorAll('#cmp-type-group .seg-btn').forEach(x=>x.classList.toggle('active', x.dataset.ct===state.compareTypeFilter));
      renderCompareBody();
    });
  });
  renderCompareBody();
}
